name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Run Linux sandbox enforcement tests
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "0"
        run: go test -v ./internal/sandbox/landlock ./internal/sandbox/seccomp
      - name: Run tests with race detector
        run: go test -race -v -timeout 10m ./...

  root-sandbox:
    name: Root sandbox enforcement (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Build pure-Go helper and enforcement tests
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o "$RUNNER_TEMP/rshell" ./cmd/rshell
          go test -c -o "$RUNNER_TEMP/landlock.test" ./internal/sandbox/landlock
          go test -c -o "$RUNNER_TEMP/seccomp.test" ./internal/sandbox/seccomp
      - name: Build integration driver with race detector
        run: go test -race -c -o "$RUNNER_TEMP/rshell.test" ./cmd/rshell
      - name: Require root enforcement and integration tests to pass
        shell: bash
        run: |
          # Workers re-exec after dropping privileges; runner home directories
          # need not be traversable by the helper's service account.
          helper_dir=$(mktemp -d /tmp/rshell-root-helper.XXXXXX)
          trap 'rm -rf "$helper_dir"' EXIT
          chmod 755 "$helper_dir"
          install -m 755 "$RUNNER_TEMP/rshell" "$helper_dir/rshell"
          sudo "$RUNNER_TEMP/landlock.test" -test.v -test.timeout=2m \
            -test.run='^TestRestrict(EnforcesReadAndWritePolicy|UsesValidatedDescriptorAfterPathReplacement)$' \
            | tee "$RUNNER_TEMP/root-tests.log"
          sudo "$RUNNER_TEMP/seccomp.test" -test.v -test.timeout=2m \
            -test.run='^TestDeniedSyscallRemainsDeniedAfterSelectiveElevation$' \
            | tee -a "$RUNNER_TEMP/root-tests.log"
          sudo env RSHELL_ROOT_INTEGRATION=1 RSHELL_BINARY="$helper_dir/rshell" \
            "$RUNNER_TEMP/rshell.test" -test.v -test.timeout=2m \
            -test.run='^TestPrivilegedHelper(OwnSocket|ConcurrentSocketStarts)?RootIntegration$' \
            | tee -a "$RUNNER_TEMP/root-tests.log"
          for test in TestRestrictEnforcesReadAndWritePolicy \
            TestRestrictUsesValidatedDescriptorAfterPathReplacement \
            TestDeniedSyscallRemainsDeniedAfterSelectiveElevation \
            TestPrivilegedHelperRootIntegration \
            TestPrivilegedHelperOwnSocketRootIntegration \
            TestPrivilegedHelperConcurrentSocketStartsRootIntegration; do
            if ! grep -Eq "^--- PASS: $test \\(" "$RUNNER_TEMP/root-tests.log"; then
              echo "Required root test did not pass: $test" >&2
              exit 1
            fi
          done

  fuzz:
    name: Fuzz seed corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Run fuzz seed corpus (regression test)
        run: go test -run '^Fuzz' ./builtins/... -timeout 120s

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  test-against-bash:
    name: Test against Bash (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Run bash comparison tests
        env:
          RSHELL_BASH_TEST: "1"
        run: go test -v -run TestShellScenariosAgainstBash ./tests/
