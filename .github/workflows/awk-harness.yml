name: AWK Scenario Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rewritten:
    name: Run rewritten AWK scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned GNU awk oracle
        run: tools/awk-harness/run.sh install-gawk
      - name: Build rshell
        run: make build
      - name: Check rewritten AWK scenario metadata
        run: go test ./tests -run TestAwkScenarioMetadata -count=1
      - name: Run rewritten AWK scenarios against rshell awk
        env:
          RSHELL_BIN: ./rshell
          AWK_UNDER_TEST: tools/awk-harness/rshell-awk
        run: tools/awk-harness/run.sh rewritten
