name: AWK External Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    name: Fetch external AWK tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned GNU awk oracle
        run: tools/awk-harness/run.sh install-gawk
      - name: Run rewritten AWK scenarios against pinned GNU awk
        run: tools/awk-harness/run.sh rewritten
      - name: Fetch One True Awk tests
        env:
          AWK_HARNESS_BOOTSTRAP: "1"
        run: tools/awk-harness/run.sh onetrueawk
      - name: Fetch gawk tests matching pinned oracle
        env:
          AWK_HARNESS_BOOTSTRAP: "1"
        run: tools/awk-harness/run.sh gawk
      - name: Check AWK rewrite map coverage
        run: tools/awk-harness/run.sh check-rewrite-map
