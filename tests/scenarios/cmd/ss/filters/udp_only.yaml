# skip: output depends on live kernel socket state which differs between hosts.
description: ss -u restricts output to UDP sockets and exits 0.
skip_assert_against_bash: true
input:
  allowed_paths: ["/proc/net"]
  script: |+
    ss -u; echo "exit:$?"
expect:
  stdout_contains:
    - "Netid"
    - "exit:0"
  stderr: ""
  exit_code: 0
