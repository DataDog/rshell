# Derived from bash: HOME=/path cd uses the inline HOME assignment to navigate.
# The script avoids string-comparing $PWD with a constructed path to stay
# cross-platform (Windows $PWD uses backslashes, "/" separator would mismatch).
# Instead we verify the navigation succeeded by checking for a known file.
description: HOME=/path cd uses the inline HOME assignment to change directories.
setup:
  files:
    - path: myhome/keep
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    HOME="$PWD/myhome" cd
    [ -f keep ] && echo ok
expect:
  stdout: |+
    ok
  stderr: |+
  exit_code: 0
