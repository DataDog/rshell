# Derived from POSIX: cd into a regular file is an error.
description: cd into a regular file reports "not a directory".
setup:
  files:
    - path: regular.txt
      content: "hello\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd regular.txt
expect:
  stdout: ""
  # rshell emits "not a directory"; bash emits "Not a directory". Use
  # substring assertions that match both.
  stderr_contains: ["cd: regular.txt", "ot a directory"]
  exit_code: 1
