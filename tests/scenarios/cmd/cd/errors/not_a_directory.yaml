# Derived from POSIX: cd into a regular file is an error.
description: cd into a regular file reports "Not a directory".
setup:
  files:
    - path: regular.txt
      content: "hello\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd regular.txt
expect:
  stdout: |+
  # bash prefixes with the script filename; rshell does not.
  # Use a substring assertion so the same scenario passes against both.
  stderr_contains: ["cd: regular.txt: Not a directory"]
  exit_code: 1
