description: cd with an empty-string operand is rejected with exit 1.
# Behaviour for `cd ""` is undefined by POSIX and varies between bash
# versions: macOS bash 3.2 errors with "cd: null directory" exit 1, but
# debian-bookworm bash 5.2 (the CI image) silently treats it as a no-arg
# cd to $HOME (exit 0). We always reject it for predictable script
# behaviour, so cannot agree with both.
skip_assert_against_bash: true
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd ""
expect:
  stdout: ""
  stderr_contains: ["cd:", "invalid empty operand"]
  exit_code: 1
