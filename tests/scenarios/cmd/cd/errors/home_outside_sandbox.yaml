description: cd with no operand uses $HOME; an out-of-sandbox HOME is rejected with permission denied.
# bash has no sandbox so it does not match this rejection; the test exercises
# the path where resolveOperand succeeds (HOME is set + non-empty) but
# changeDir refuses because the target lies outside AllowedPaths — distinct
# from the unset-HOME path (errors/home_unset.yaml) and the empty-HOME no-op
# path (basic/home_empty_is_noop.yaml).
skip_assert_against_bash: true
input:
  allowed_paths: ["$DIR"]
  script: |+
    HOME=/etc cd
expect:
  stdout: ""
  stderr_contains: ["cd:", "permission denied"]
  exit_code: 1
