# Derived from bash: cd "" is a no-op success — stays in $PWD and returns 0.
description: cd with an empty-string argument is a no-op success.
input:
  allowed_paths: ["$DIR"]
  script: |+
    BEFORE="$PWD"
    cd ""
    [ "$PWD" = "$BEFORE" ] && echo ok
expect:
  stdout: |+
    ok
  stderr: ""
  exit_code: 0
