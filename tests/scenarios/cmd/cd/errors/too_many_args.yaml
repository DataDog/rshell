# Derived from POSIX: cd with more than one operand is an error.
description: cd with multiple positional arguments errors.
input:
  allowed_paths: ["$DIR"]
  script: |+
    cd a b
expect:
  stdout: ""
  # bash prefixes its error with "bash: line N:"; rshell does not. Use a
  # substring assertion so the same scenario passes against both.
  stderr_contains: ["cd: too many arguments"]
  exit_code: 1
