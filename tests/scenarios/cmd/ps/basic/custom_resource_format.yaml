description: ps custom format exposes the supported resource fields without exposing process arguments.
skip_assert_against_bash: true
input:
  script: |+
    ps -p $$ -o pid,ppid,pcpu,pmem,rss,vsz,etime,comm --sort=-rss,+pid
expect:
  stdout_contains:
    - "PID"
    - "PPID"
    - "%CPU"
    - "%MEM"
    - "RSS"
    - "VSZ"
    - "ELAPSED"
    - "COMMAND"
  exit_code: 0
