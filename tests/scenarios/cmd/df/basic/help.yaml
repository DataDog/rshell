description: df --help prints usage to stdout
# skip: GNU df --help includes flags we don't implement (-B, --output,
# --version) and a different footer; we keep the help format minimal.
skip_assert_against_bash: true
input:
  script: |+
    df --help
expect:
  stdout_contains: ["Usage: df", "human-readable", "portability", "inodes", "exclude-type", "print-type"]
  stderr: ""
  exit_code: 0
