description: df --help lists every flag we support and excludes flags we deliberately reject (--sync, --version, --output, --block-size, --kibibytes). Locks in the supported-flag surface as part of the user-facing contract.
skip_assert_against_bash: true
input:
  script: |+
    df --help
expect:
  stdout_contains:
    - "Usage: df"
    - "--all"
    - "--exclude-type"
    - "--help"
    - "--human-readable"
    - "--inodes"
    - "--local"
    - "--no-sync"
    - "--portability"
    - "--print-type"
    - "--si"
    - "--total"
    - "--type"
    - "-k"
  stderr: ""
  exit_code: 0
