description: df with no flags exits 0 and prints a header
# skip: output depends on the live mount table which differs between hosts.
skip_assert_against_bash: true
input:
  script: |+
    df; echo "code:$?"
expect:
  stdout_contains:
    - "Filesystem"
    - "1K-blocks"
    - "Mounted on"
    - "code:0"
  stderr: ""
  exit_code: 0
