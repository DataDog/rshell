description: df rejects -t TYPE -x TYPE for the same TYPE — GNU df treats this as a usage error rather than silently letting exclusion win, so configs that name the same type in both lists fail loudly. Verified before any platform check, so this works on Linux/macOS/Windows.
skip_assert_against_bash: true
input:
  script: |+
    df -t apfs -x apfs; echo "code:$?"
expect:
  stdout_contains:
    - "code:1"
  stderr_contains:
    - "df:"
    - "both selected and excluded"
  exit_code: 0
