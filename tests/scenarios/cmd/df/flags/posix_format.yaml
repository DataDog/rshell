description: df -P emits the exact POSIX header line
# skip: output rows depend on the live mount table; only the header is
# stable enough to compare exactly.
skip_assert_against_bash: true
input:
  script: |+
    df -P | head -n 1
expect:
  stdout: |+
    Filesystem 1024-blocks Used Available Capacity Mounted on
  stderr: ""
  exit_code: 0
