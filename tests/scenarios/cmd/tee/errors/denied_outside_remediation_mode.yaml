# Security: tee mutates file content, so — like truncate, logrotate, rm, and
# systemctl — it must be refused entirely in read-only mode.
description: tee is refused entirely outside remediation mode; no file is created.
input:
  allowed_paths: ["$DIR:rw"]
  script: |+
    printf "hi\n" | tee out.txt
expect:
  stdout: |+
  stderr_contains: ["tee:"]
  exit_code: 1
skip_assert_against_bash: true
