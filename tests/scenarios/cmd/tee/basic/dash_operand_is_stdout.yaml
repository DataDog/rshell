# GNU tee treats "-" as a FILE operand naming standard output again, not a
# literal filename.
description: A "-" FILE operand writes to standard output again, not a file named "-".
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    printf "viadash\n" | tee -
expect:
  stdout: |+
    viadash
    viadash
  stderr: |+
  exit_code: 0
