description: python os.getcwd() is not available (blocked).
skip_assert_against_bash: true
setup:
  files:
    - path: getcwd.py
      content: |+
        import os
        try:
            os.getcwd()
            print("not blocked")
        except AttributeError:
            print("blocked")
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    python getcwd.py
expect:
  stdout: |+
    blocked
  stderr: |+
  exit_code: 0
