description: json.loads raises ValueError (matching CPython's json.JSONDecodeError which is a subclass of ValueError) so callers using except ValueError can handle the error correctly.
skip_assert_against_bash: true
input:
  script: |+
    python -c "
    import json
    try:
        json.loads('{\"a\": 1}')
        print('no error')
    except ValueError:
        print('ValueError raised')
    except NotImplementedError:
        print('NotImplementedError raised (wrong)')
    "
expect:
  stdout: |+
    ValueError raised
  stderr: |+
  exit_code: 0
