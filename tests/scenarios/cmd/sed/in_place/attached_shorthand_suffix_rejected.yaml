# GNU sed's -i[SUFFIX] syntax means any character attached to -i within a
# short-option cluster is a backup suffix, even when that character also
# happens to be another registered shorthand flag letter (here, -E).
# Verified against real GNU sed 4.9: `sed -iE 's/hello/bye/' file` creates
# a backup literally named "fileE" rather than silently enabling extended
# regex mode with no backup, which is what naive short-cluster flag parsing
# would otherwise do. Since this shell does not support backup suffixes,
# it must reject the attempt rather than silently misinterpreting -iE as
# -i plus -E.
description: sed -iE (attached shorthand-letter suffix) is rejected, not silently parsed as -i plus -E.
setup:
  files:
    - path: input.txt
      content: |+
        hello
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    sed -iE 's/hello/bye/' input.txt; echo "exit=$?"
    cat input.txt
expect:
  stdout: |+
    exit=1
    hello
  stderr: |+
    sed: invalid option -- '='
    Try 'sed --help' for more information.
  exit_code: 0
# skip: this shell intentionally rejects the -i[SUFFIX] backup-suffix
# syntax (no rename primitive to create the backup atomically), whereas
# GNU sed accepts -iE and creates a backup file named "inputE" — same
# documented divergence as backup_suffix_rejected.yaml.
skip_assert_against_bash: true
