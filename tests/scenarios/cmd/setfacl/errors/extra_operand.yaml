# skip: rshell setfacl is a narrow POSIX ACL helper, not GNU setfacl; there
# is no real `setfacl` binary in the debian:bookworm-slim comparison image
# to compare against.
description: setfacl rejects a second positional operand
skip_assert_against_bash: true
setup:
  files:
    - path: app
      content: "x"
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    setfacl -m g:dd-agent:rx app extra
expect:
  stdout: |+
  stderr: |+
    setfacl: extra operand 'extra'
  exit_code: 1
