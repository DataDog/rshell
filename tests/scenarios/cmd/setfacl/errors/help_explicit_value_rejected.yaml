# skip: rshell setfacl is a narrow POSIX ACL helper, not GNU setfacl; there
# is no real `setfacl` binary in the debian:bookworm-slim comparison image
# to compare against.
description: setfacl --help=true is rejected — --help takes no argument, matching GNU getopt no-argument semantics (df's/free's noArgBool pattern)
skip_assert_against_bash: true
input:
  allowed_paths: ["$DIR:rw"]
  mode: "remediation"
  script: |+
    setfacl --help=true
expect:
  stdout: |+
  stderr: |+
    setfacl: option '--help' doesn't allow an argument
    Try 'setfacl --help' for more information.
  exit_code: 1
