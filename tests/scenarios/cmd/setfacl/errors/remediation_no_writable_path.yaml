# skip: rshell setfacl is a narrow POSIX ACL helper, not GNU setfacl; there
# is no real `setfacl` binary in the debian:bookworm-slim comparison image
# to compare against, and this case is specific to rshell's AllowedPaths
# sandbox.
description: setfacl in remediation mode with no writable AllowedPaths root blames the missing writable root, not the mode.
skip_assert_against_bash: true
input:
  mode: "remediation"
  script: |+
    setfacl -m g:dd-agent:rx app
expect:
  stdout: |+
  stderr: |+
    setfacl: no writable path is configured (remediation mode requires an AllowedPaths entry with :rw)
  exit_code: 1
