# skip: rshell reports different error format than bash for unavailable commands
skip_assert_against_bash: true
description: The rm command is not a builtin and is rejected as unknown.
input:
  script: |+
    rm file.txt
expect:
  stdout: ""
  stderr: |+
    rshell: rm: unknown command
    Run 'help' to see available commands.
  exit_code: 127
