description: Help in read-only mode distinguishes allowed remediation-only commands from commands disabled by policy and shows descriptions for the mode-gated commands.
skip_assert_against_bash: true
input:
  allowed_commands: ["rshell:echo", "rshell:help", "rshell:rm", "rshell:truncate"]
  script: |+
    help
expect:
  stdout_contains:
    - "Commands available now (2):"
    - "Require remediation mode (2):"
    - "rm        remove files"
    - "truncate  shrink or extend file size"
    - "Disabled by policy ("
  stderr: ""
  exit_code: 0
