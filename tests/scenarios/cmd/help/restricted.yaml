description: Help lists only commands allowed by the active policy.
skip_assert_against_bash: true
input:
  allowed_commands: ["rshell:echo", "rshell:help"]
  script: |+
    help
expect:
  stdout: |+
    rshell (dev) — 2 of 29 builtins enabled

    echo  write arguments to stdout
    help  display help for commands

    Disabled builtins: [, break, cat, continue, cut, exit, false, find, grep, head, ip, jq, ls, ping,
      printf, ps, sed, sort, ss, strings, tail, test, tr, true, uname, uniq, wc

    Run 'help <command>' for more information on a specific command.
  stderr: ""
  exit_code: 0
