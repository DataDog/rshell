# skip: rshell logrotate is a remediation-only truncation helper, not system logrotate.
skip_assert_against_bash: true
description: logrotate is unavailable outside remediation mode.
setup:
  files:
    - path: app.log
      content: "abcde"
input:
  allowed_paths: ["$DIR"]
  script: |+
    logrotate --force app.log
expect:
  stdout: |+
  stderr: |+
    logrotate: command requires remediation mode
  exit_code: 1
