# skip: logrotate is a demo builtin with no bash equivalent.
skip_assert_against_bash: true
description: -s SIZE truncates when the file is at or above the threshold.
setup:
  files:
    - path: big.log
      # 1100 bytes, well above the 1K threshold.
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    logrotate -s 1K big.log
    wc -c < big.log
expect:
  stdout: |+
    0
  stderr: |+
  exit_code: 0
