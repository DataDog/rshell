# GNU head rejects --quiet=<value> and --verbose=<value> for every value,
# including =true (options don't allow arguments). The previous "true"
# NoOptDefVal sentinel was forgeable, so --quiet=true was silently accepted;
# the NUL sentinel closes that. bash comparison is skipped because rshell
# exits 1 uniformly on flag errors.
description: head rejects --quiet=true and --quiet=false (GNU no-argument refusal).
skip_assert_against_bash: true
setup:
  files:
    - path: file.txt
      content: "hello\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    head --quiet=true file.txt; echo "code:$?"
    head --quiet=false file.txt; echo "code:$?"
expect:
  stdout: |+
    code:1
    code:1
  stderr: |+
    head: option '--quiet' doesn't allow an argument
    Try 'head --help' for more information.
    head: option '--quiet' doesn't allow an argument
    Try 'head --help' for more information.
  exit_code: 0
