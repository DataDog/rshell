# Scenario runners do not grant systemd capabilities by default.
skip_assert_against_bash: true
description: journalctl disk usage enforces the shared storage allowlist
input:
  script: |+
    journalctl --disk-usage
expect:
  stdout: |+
  stderr: |+
    journalctl: systemd resource "journal:storage" is not allowed for action "read"
  exit_code: 1
