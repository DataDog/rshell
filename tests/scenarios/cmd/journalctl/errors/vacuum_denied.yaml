# Remediation mode alone does not bypass the shared systemd allowlist.
skip_assert_against_bash: true
description: journalctl vacuum requires a storage clean grant
input:
  mode: remediation
  script: |+
    journalctl --vacuum-size=64M
expect:
  stdout: |+
  stderr: |+
    journalctl: systemd resource "journal:storage" is not allowed for action "clean"
  exit_code: 1
