description: rg -a searches a file with a NUL byte as text and prints the matching line.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: bin.dat
      content: "abc\x00def\n"
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg -a abc bin.dat
expect:
  stdout_contains: ["abc"]
  stderr: ""
  exit_code: 0
