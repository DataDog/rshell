description: rg -o does not suppress -A/-B/-C context, unlike GNU grep (verified directly against real ripgrep).
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: file.txt
      content: |+
        1
        match
        3
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg -o -C1 match file.txt
expect:
  stdout: |+
    1
    match
    3
  stderr: ""
  exit_code: 0
