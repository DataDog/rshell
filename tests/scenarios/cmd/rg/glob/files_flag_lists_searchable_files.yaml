description: rg --files lists files that would be searched without searching their content.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: a.txt
      content: "x"
      chmod: 0644
    - path: sub/b.txt
      content: "y"
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg --files | sort
expect:
  stdout: |+
    a.txt
    sub/b.txt
  stderr: ""
  exit_code: 0
