description: rg's -g glob does not reveal a TOP-LEVEL hidden directory via a trailing "**", matching real ripgrep exactly, since the pattern only matches paths strictly inside ".cache" (not ".cache" itself) and ".cache" has no visible ancestor for the glob to anchor on; see slash_glob_reveals_nested_hidden_entry.yaml for the case where a slash-containing glob DOES reveal a hidden entry below a visible ancestor.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: .cache/a
      content: |+
        x
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg --files -g '.cache/**'
expect:
  stdout: ""
  stderr: ""
  exit_code: 1
