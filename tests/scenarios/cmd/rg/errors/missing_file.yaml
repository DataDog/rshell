description: rg reports an error and exits 2 for a nonexistent file.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg foo does-not-exist.txt
expect:
  stdout: ""
  stderr_contains: ["does-not-exist.txt"]
  exit_code: 2
