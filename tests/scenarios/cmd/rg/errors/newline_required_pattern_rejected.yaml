description: rg rejects a pattern whose only possible match requires a literal newline character, matching real ripgrep's own message exactly, since a per-line scanner can never satisfy it.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: file.txt
      content: |+
        x
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg '\n' file.txt
expect:
  stdout: ""
  stderr_contains: ["the literal \"\\n\" is not allowed in a regex"]
  exit_code: 2
