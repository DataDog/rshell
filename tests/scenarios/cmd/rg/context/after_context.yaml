description: rg -A NUM prints NUM lines after each match.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: file.txt
      content: |+
        1
        2
        match
        4
        5
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg -A2 match file.txt
expect:
  stdout: |+
    match
    4
    5
  stderr: ""
  exit_code: 0
