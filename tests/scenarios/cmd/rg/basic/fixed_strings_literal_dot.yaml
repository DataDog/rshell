description: rg -F treats the pattern as a literal string, so a literal dot does not match any character.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: file.txt
      content: |+
        a.b
        axb
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg -F 'a.b' file.txt
expect:
  stdout: |+
    a.b
  stderr: ""
  exit_code: 0
