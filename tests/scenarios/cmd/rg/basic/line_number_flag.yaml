description: rg -n prefixes matches with their 1-based line number.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: file.txt
      content: |+
        alpha
        beta
        gamma
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg -n beta file.txt
expect:
  stdout: |+
    2:beta
  stderr: ""
  exit_code: 0
