description: rg's filename-bearing output prepends a directory operand's original spelling (not a cleaned/joined path) to every path discovered beneath it, matching real ripgrep exactly.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: sub/f
      content: |+
        x
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg -H x .
expect:
  stdout: |+
    ./sub/f:x
  stderr: ""
  exit_code: 0
