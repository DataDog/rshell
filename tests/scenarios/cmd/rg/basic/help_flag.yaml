description: rg --help prints usage information to stdout and exits 0.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg --help
expect:
  stdout_contains: ["Usage: rg", "--glob"]
  stderr: ""
  exit_code: 0
