description: rg prefixes matches with the file path when more than one file is searched.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: a.txt
      content: |+
        foo
      chmod: 0644
    - path: b.txt
      content: |+
        foo
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg foo a.txt b.txt
expect:
  stdout: |+
    a.txt:foo
    b.txt:foo
  stderr: ""
  exit_code: 0
