description: rg exits 1 with no output when the pattern is not found.
skip_assert_against_bash: true  # rg is not a shell builtin available in the bash comparison image
setup:
  files:
    - path: file.txt
      content: |+
        alpha
      chmod: 0644
input:
  allowed_paths: ["$DIR"]
  script: |+
    rg nomatch file.txt
expect:
  stdout: ""
  stderr: ""
  exit_code: 1
