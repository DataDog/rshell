description: truncate continues after a missing operand and exits 1 at the end.
setup:
  files:
    - path: a.txt
      content: "alpha\n"
    - path: c.txt
      content: "gamma\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    truncate -c -s 0 a.txt b.txt c.txt
    wc -c < a.txt
    wc -c < c.txt
expect:
  stdout: |+
    0
    0
  stderr: |+
  exit_code: 0
