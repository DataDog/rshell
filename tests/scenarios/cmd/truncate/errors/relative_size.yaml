# skip: GNU truncate accepts +10/<10/>10 as relative modifiers; we reject them as unsupported.
skip_assert_against_bash: true
description: A leading +/</> in -s is rejected (relative size modifiers unsupported).
setup:
  files:
    - path: a.txt
      content: "abc"
input:
  allowed_paths: ["$DIR"]
  script: |+
    truncate -s=+10 a.txt
expect:
  stdout: ""
  stderr_contains:
    - "truncate:"
    - "relative size operators not supported"
  exit_code: 1
