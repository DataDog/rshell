# skip: GNU truncate's exact error wording differs; we test our own message.
skip_assert_against_bash: true
description: A non-numeric -s value is rejected with exit 1.
setup:
  files:
    - path: a.txt
      content: ""
input:
  allowed_paths: ["$DIR"]
  script: |+
    truncate -s xyz a.txt
expect:
  stdout: ""
  stderr_contains:
    - "truncate:"
    - "invalid size"
  exit_code: 1
