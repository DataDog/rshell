# Derived from GNU coreutils truncate.sh test — invalid size string.
description: A non-numeric size argument causes exit 1 with an error message.
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR"]
  remediation_mode: true
  script: |+
    truncate -s notanumber f.txt
expect:
  stdout: |+
  stderr_contains: ["invalid size"]
  exit_code: 1
skip_assert_against_bash: true
