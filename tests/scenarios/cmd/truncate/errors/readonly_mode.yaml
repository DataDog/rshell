# Security test: truncate in read-only mode (no remediation) is rejected.
description: truncate without remediation mode is rejected before its handler runs.
setup:
  files:
    - path: f.txt
      content: "data"
input:
  allowed_paths: ["$DIR"]
  script: |+
    truncate -s 0 f.txt
expect:
  stdout: |+
  stderr: |+
    truncate: command requires remediation mode
  exit_code: 1
skip_assert_against_bash: true
