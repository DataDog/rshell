# Derived from GNU coreutils truncate.sh test — extend-to-size path.
description: truncate -s N extends a smaller file with zero bytes.
setup:
  files:
    - path: small.bin
      content: "abc"
input:
  allowed_paths: ["$DIR"]
  mode: "remediation"
  script: |+
    truncate -s 1024 small.bin
    wc -c < small.bin
expect:
  stdout: |+
    1024
  stderr: |+
  exit_code: 0
