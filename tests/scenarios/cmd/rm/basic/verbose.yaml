# Derived from uutils test_rm.rs::test_rm_verbose.
description: rm -v prints "removed 'path'" for each removed file.
setup:
  files:
    - path: target.txt
      content: "data"
input:
  allowed_paths: ["$DIR"]
  mode: "remediation"
  script: |+
    rm -v target.txt
expect:
  stdout: |+
    removed 'target.txt'
  stderr: |+
  exit_code: 0
skip_assert_against_bash: true
