# Security test: rm cannot remove files outside AllowedPaths.
description: rm rejects targets outside the AllowedPaths sandbox.
setup:
  files:
    - path: allowed/f.txt
      content: "data"
input:
  allowed_paths: ["$DIR/allowed"]
  mode: "remediation"
  script: |+
    rm ../outside.txt
expect:
  stdout: |+
  stderr_contains: ["rm"]
  exit_code: 1
skip_assert_against_bash: true
