# Security: -r/--recursive must be rejected — recursive deletion is out of scope.
description: rm -r is rejected as an unrecognized option.
setup:
  files:
    - path: dir/file.txt
      content: "data"
input:
  allowed_paths: ["$DIR"]
  mode: "remediation"
  script: |+
    rm -r dir
expect:
  stdout: |+
  stderr_contains: ["invalid option"]
  exit_code: 1
skip_assert_against_bash: true
