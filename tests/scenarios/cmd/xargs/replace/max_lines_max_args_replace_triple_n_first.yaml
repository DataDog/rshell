skip_assert_against_bash: true
description: xargs emits two warnings when -n, -L, and -I are all specified (n first, L middle, I last).
input:
  script: |+
    printf 'a\nb\n' | xargs -n 2 -L 1 -I {} echo {}
expect:
  stdout: |+
    a
    b
  stderr: |+
    xargs: warning: options --max-args and -L are mutually exclusive, ignoring previous --max-args value
    xargs: warning: options --max-lines and --replace/-I/-i are mutually exclusive, ignoring previous --max-lines value
  exit_code: 0
