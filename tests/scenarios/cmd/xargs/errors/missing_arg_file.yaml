# skip: rshell builtin error format differs from GNU xargs (path-error wording)
skip_assert_against_bash: true
description: xargs -a on a nonexistent file exits 1 and prints an error to stderr.
input:
  allowed_paths: ["$DIR"]
  script: |+
    xargs -a nonexistent.txt echo
expect:
  stdout: ""
  # stderr_contains used intentionally: the OS-level error suffix (e.g. "no such
  # file or directory" vs "The system cannot find the file specified") varies
  # across platforms. The xargs: prefix is stable and sufficient to verify the
  # error was reported.
  stderr_contains: ["xargs:"]
  exit_code: 1
