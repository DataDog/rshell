# skip: rshell adds -h as an alias for --help; GNU xargs does not recognise -h.
# rshell help output also differs from GNU xargs.
skip_assert_against_bash: true
description: xargs --help and -h both print usage to stdout and exit 0.
input:
  script: |+
    xargs --help
    xargs -h
expect:
  stdout_contains: ["Usage:", "--max-args"]
  stderr: |+
  exit_code: 0
