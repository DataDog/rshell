# Intentional stderr divergence: GNU xargs emits a "previous --max-lines
# value ignored" warning; rshell drops the loser silently. The behavior on
# stdout and exit code is identical.
skip_assert_against_bash: true
description: xargs -n / -L / -I are mutually exclusive; the last one specified wins (matches GNU last-wins on stdout/exit; rshell drops the loser silently instead of warning).
input:
  script: |+
    printf 'a\nb\nc\n' | xargs -L1 -n3 echo
expect:
  stdout: |+
    a b c
  stderr: ""
  exit_code: 0
