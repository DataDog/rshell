# When a NUL byte appears in the leading-whitespace region (before any token
# content), rshell warns and discards the NUL-contaminated word via
# discardUntilWhitespace, producing zero tokens for input like "\x00b\n".
# GNU xargs emits an empty-string token for the NUL-contaminated word
# (one invocation with an empty argument).
# Although the internal paths differ (rshell: finishEmpty -> echo with no args;
# GNU: one invocation with empty-string arg), both produce identical visible output:
# stdout=\n (blank line), stderr=NUL warning, exit=0.
description: NUL in leading whitespace region — rshell and GNU both produce a blank line and NUL warning.
input:
  script: |+
    printf '\x00b\n' | xargs echo
expect:
  stdout: |+

  stderr: |+
    xargs: WARNING: a NUL character occurred in the input.  It cannot be passed through in the argument list.  Did you mean to use the --null option?
  exit_code: 0
