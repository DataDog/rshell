# skip: error message wording differs from GNU xargs (rshell uses its own validation format).
skip_assert_against_bash: true
description: xargs rejects multi-byte delimiters that are not the documented escape forms.
input:
  script: |+
    echo a | xargs -d ab echo
expect:
  stdout: ""
  stderr: |+
    xargs: invalid delimiter: delimiter must be a single character: "ab"
  exit_code: 1
