# skip: error message wording differs from GNU xargs (rshell uses its own validation format).
skip_assert_against_bash: true
description: xargs -n with a non-positive value is rejected.
input:
  script: |+
    echo a | xargs -n 0 echo
expect:
  stdout: ""
  stderr: |+
    xargs: invalid -n value: 0
  exit_code: 1
