# skip: rshell exits 1 for unknown flags; GNU xargs exits 0 (writing the error
# to stderr but not treating it as fatal). rshell's stricter validation is
# intentional. The error message wording also differs between pflag and GNU.
skip_assert_against_bash: true
description: xargs rejects unknown flags with exit code 1.
input:
  script: |+
    xargs --not-a-flag
expect:
  stdout: ""
  stderr: |+
    xargs: unknown flag: --not-a-flag
  exit_code: 1
