# Intentional hardening divergence: GNU xargs accepts both flags (last-wins);
# the rshell sandbox rejects the combination to avoid an ambiguous tokenizer
# mode.
skip_assert_against_bash: true
description: xargs -0 and -d are mutually exclusive (rshell hardening).
input:
  script: |+
    echo a | xargs -0 -d , echo
expect:
  stdout: ""
  stderr_contains: ["mutually exclusive"]
  exit_code: 1
