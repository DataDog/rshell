description: Classic BEGIN-action-END idiom sums first column.
setup:
  files:
    - path: nums.txt
      content: |+
        10
        20
        30
        40
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk 'BEGIN {sum=0} {sum += $1} END {print sum}' nums.txt
expect:
  stdout: |+
    100
  stderr: |+
  exit_code: 0
