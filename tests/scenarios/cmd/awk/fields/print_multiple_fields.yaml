description: Print multiple fields, separated by OFS (default space).
setup:
  files:
    - path: input.txt
      content: |+
        alpha beta gamma delta
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{print $1, $3}' input.txt
expect:
  stdout: |+
    alpha gamma
  stderr: |+
  exit_code: 0
