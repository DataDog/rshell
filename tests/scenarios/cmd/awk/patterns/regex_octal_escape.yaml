description: awk regular expression literals support octal byte escapes.
input:
  script: |+
    printf 'a\n141\n.\nx\n' | awk '/\141/ { print "a", $0 } /\056/ { print "dot", $0 }'
    printf '\377\n' | awk '/\377/ { print "byte" }'
    printf '\377\n' | awk 'BEGIN { r = "\377" } $0 ~ r { print "dynamic" }'
    printf '\303\251\377\n' | awk 'BEGIN { r = "\303\251\377" } $0 ~ r { print "mixed" }'
    awk 'BEGIN { IGNORECASE = 1; print ("\300" ~ /\340/), ("\300A" ~ /^\300a$/) }'
    awk 'BEGIN { s = "é"; print gsub(/\377|./, "X", s), s; s = "\376é"; print gsub(/\377|./, "X", s), s }'
expect:
  stdout: |+
    a a
    dot a
    dot 141
    dot .
    dot x
    byte
    dynamic
    mixed
    0 1
    1 X
    2 XX
  stderr: |+
  exit_code: 0
