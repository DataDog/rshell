description: awk IGNORECASE regular expressions use C.UTF-8 case equivalence.
input:
  script: |+
    awk 'BEGIN { IGNORECASE = 1; print ("K" ~ /k/), ("ı" ~ /I/), ("Å" ~ /å/), ("ϴ" ~ /θ/), ("Ω" ~ /ω/); print ("K" ~ /[k]/), ("ı" ~ /[I]/), ("K" ~ /[^k]/), ("ı" ~ /[^I]/), ("ak" ~ /[^^]k/), ("aK" ~ /[^^]k/); n = split("Kı", a, /k/); print n, "[" a[1] "]", "[" a[2] "]"; s = "Kı"; print gsub(/k|I/, "x", s), s }'
expect:
  stdout: |+
    0 1 0 0 0
    0 1 1 0 1 0
    1 [Kı] []
    1 Kx
  stderr: |+
  exit_code: 0
