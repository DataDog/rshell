description: awk regex bracket classes may contain slash literals.
skip_assert_against_bash: true
setup:
  files:
    - path: input.txt
      content: |+
        /
        x
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '/[/]/ { print }' input.txt
expect:
  stdout: |+
    /
  stderr: |+
  exit_code: 0
