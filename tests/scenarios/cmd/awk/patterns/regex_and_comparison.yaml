description: awk filters records with comparisons and regex match operators.
setup:
  files:
    - path: input.txt
      content: |+
        ok 1
        error 2
        warn 3
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '$2 > 1 && $1 !~ /warn/ { print $1 }' input.txt
    awk 'BEGIN { x="a"; r="a"; a[1]=1; print x ~ r == 1, 1 in a == 1 }'
    awk 'BEGIN { print ("A" ~ /^(?i)a$/), ("?ia" ~ /^(?i)a$/), ("a" ~ /^(?:a)$/), ("?:a" ~ /^(?:a)$/), ("a" ~ /^(?P<x>a)$/), ("?P<x>a" ~ /^(?P<x>a)$/) }'
expect:
  stdout: |+
    error
    0 1
    0 1 0 1 0 1
  stderr: |+
  exit_code: 0
