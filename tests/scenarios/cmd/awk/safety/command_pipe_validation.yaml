description: awk command pipes reject empty targets and shell syntax blocked by rshell.
input:
  script: |+
    awk 'BEGIN { print "payload" | "echo $((1 + 1))" }'
    awk 'BEGIN { cmd = ""; print "payload" | cmd }'
expect:
  stdout: |+
  stderr: |+
    awk: arithmetic expansion is not supported
    awk: fatal: expression for `|' redirection has null string value
  exit_code: 2
