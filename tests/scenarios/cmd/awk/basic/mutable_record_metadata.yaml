description: awk permits NR, FNR, and FILENAME assignments and updates them across later records and files.
setup:
  files:
    - path: one.txt
      content: |+
        a
        b
    - path: two.txt
      content: |+
        c
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk 'NR == 1 { NR = 10.5; FNR = 20.5; FILENAME = "renamed" } { print NR ":" FNR ":" FILENAME }' one.txt two.txt
expect:
  stdout: |+
    10.5:20.5:renamed
    11.5:21.5:renamed
    12.5:1:two.txt
  stderr: |+
  exit_code: 0
