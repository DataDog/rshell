description: awk command pipes preserve observable output and start with a fresh status.
input:
  script: |+
    awk 'BEGIN { print "b" | "cat"; print "a"; close("cat") }'
    awk 'BEGIN { cmd = "cat"; print "b" | cmd; print "a"; close(cmd) }'
    awk 'BEGIN { print "x" | "cat"; print "z"; print "y" | "cat" }'
    awk 'BEGIN { cmd = "awk \"{ n++ } END { print n }\""; print "a" | cmd; printf ""; print "b" | cmd; close(cmd) }'
    awk 'BEGIN { print "b" | "sort"; print "mid"; print "a" | "sort"; close("sort") }'
    awk 'BEGIN { for (i = 1; i <= 2; i++) { print i | "cat"; print "x" } close("cat") }'
    printf '1\n2\n' | awk '{ print $0 | "cat"; print "x" } END { close("cat") }'
    awk 'function f(x) { print x | "sort"; print "s" } BEGIN { f("b"); f("a"); close("sort") }'
    awk 'BEGIN { cmd = "read x"; print "x" | cmd; got = (cmd | getline x); print got, close(cmd), close(cmd), close(cmd) }'
    awk 'BEGIN { cmd = "read x"; got = (cmd | getline x); print "x" | cmd; print got, close(cmd), close(cmd), close(cmd) }'
    false; awk 'BEGIN { "echo $?" | getline x; print x }'
    awk 'BEGIN { print "error pipe" | "cat"; zero = 0; print 1 / zero }' 2>/dev/null || true
expect:
  stdout: |+
    a
    b
    a
    b
    x
    y
    z
    2
    mid
    a
    b
    x
    x
    1
    2
    x
    x
    1
    2
    s
    s
    a
    b
    0 1 0 -1
    0 0 1 -1
    0
    error pipe
  stderr: |+
  exit_code: 0
