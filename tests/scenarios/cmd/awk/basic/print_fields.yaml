description: awk prints selected whitespace-separated fields.
setup:
  files:
    - path: input.txt
      content: |+
        alpha beta gamma
        one two three
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{ print $1, $3 }' input.txt
expect:
  stdout: |+
    alpha gamma
    one three
  stderr: ""
  exit_code: 0

