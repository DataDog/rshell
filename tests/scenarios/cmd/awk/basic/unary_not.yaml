description: awk parses unary not after concatenation and rejects literal zero divisors before short-circuit evaluation.
input:
  script: |+
    awk 'BEGIN { x="b"; y=1; print "a" !0, x !y }'
    awk 'BEGIN { print 1 || (1 / !1) }' 2>/dev/null
    printf 'zero-divisor=%s\n' "$?"
expect:
  stdout: |+
    a1 b0
    zero-divisor=1
  stderr: |+
  exit_code: 0
