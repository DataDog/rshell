description: awk handles string padding, incomplete formats, and fatal missing printf arguments.
input:
  script: |+
    awk 'BEGIN { printf "[%05s]\n[%05c]\n", "abcd", "x" }'
    awk 'BEGIN { printf "abc%"; print ""; printf "def%5"; print "" }'
    awk 'BEGIN { printf "%s" }' 2>/dev/null
    printf 'printf=%s\n' "$?"
    awk 'BEGIN { sprintf("%s") }' 2>/dev/null
    printf 'sprintf=%s\n' "$?"
expect:
  stdout: |+
    [ abcd]
    [    x]
    abc%
    def%5
    printf=2
    sprintf=2
  stderr: |+
  exit_code: 0
