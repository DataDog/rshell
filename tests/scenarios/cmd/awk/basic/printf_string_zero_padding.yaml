description: awk handles string padding and incomplete trailing printf conversions.
input:
  script: |+
    awk 'BEGIN { printf "[%05s]\n[%05c]\n", "abcd", "x" }'
    awk 'BEGIN { printf "abc%"; print ""; printf "def%5"; print "" }'
expect:
  stdout: |+
    [ abcd]
    [    x]
    abc%
    def%5
  stderr: |+
  exit_code: 0
