description: awk range patterns include records from the start match through the end match.
setup:
  files:
    - path: input.txt
      content: |+
        ignore
        start
        middle
        end
        tail
        start end
        after
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '/start/,/end/ { print NR ":" $0 }' input.txt
expect:
  stdout: |+
    2:start
    3:middle
    4:end
    6:start end
  stderr: |+
  exit_code: 0
