description: awk replacement parsing preserves malformed UTF-8 bytes after backslashes.
input:
  script: |+
    awk 'BEGIN { s = "XX"; sub(/X/, "\\\377", s); print (s == "\\\377X"); s = "XX"; gsub(/X/, "\\\376", s); print (s == "\\\376\\\376"); print (gensub(/X/, "\\\375", "g", "XX") == "\375\375") }'
expect:
  stdout: |+
    1
    1
    1
  stderr: |+
  exit_code: 0
