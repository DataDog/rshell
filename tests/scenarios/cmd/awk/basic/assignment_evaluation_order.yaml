description: awk evaluates assignment values before resolving array and field targets.
input:
  script: |+
    awk 'BEGIN { i = 1; a[i++] = i; print a[1], i; i = 1; a[1] = 10; a[i++] += i; print a[1], i }'
    awk 'BEGIN { $0 = "A B C"; i = 1; $(i++) = i; print $0, i; $0 = "10 B C"; i = 1; $(i++) += i; print $0, i }'
expect:
  stdout: |+
    1 2
    11 2
    1 B C 2
    11 B C 2
  stderr: |+
  exit_code: 0
