description: awk case conversion and IGNORECASE comparisons preserve invalid UTF-8 bytes.
input:
  script: |+
    awk 'BEGIN { print (tolower("\376A\377") == "\376a\377"), (toupper("\376a\377") == "\376A\377"); IGNORECASE = 1; print ("\376A" == "\377a"), ("\377A" == "\377a"), ("\377" == "�") }'
expect:
  stdout: |+
    1 1
    0 1 0
  stderr: |+
  exit_code: 0
