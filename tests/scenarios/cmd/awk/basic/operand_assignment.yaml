description: awk applies name=value operands in input-stream order.
skip_assert_against_bash: true
setup:
  files:
    - path: one.txt
      content: |+
        a
    - path: two.txt
      content: |+
        b
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{ print x ":" $0 }' one.txt x=foo two.txt
expect:
  stdout: |+
    :a
    foo:b
  stderr: |+
  exit_code: 0
