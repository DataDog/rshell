description: awk match capture arrays include positions, evaluate arguments before clearing, omit unmatched groups, and strtonum parses numeric prefixes.
input:
  script: |+
    awk 'BEGIN { a[1] = "abc"; print match(a[1], /(b)/, a), RSTART, RLENGTH, a[0], a[1], a[0,"start"], a[0,"length"], a[1,"start"], a[1,"length"]; print strtonum("123abc"), strtonum("-12.5ms"), strtonum("1e3rows"); print strtonum("012.3"), strtonum("012e2"), strtonum("0128"), strtonum("010"); print strtonum("+010"), strtonum("-010"), strtonum(" 010"), strtonum("+0x10"), strtonum("-0x10"), strtonum("0x10"), strtonum(" 0x10") }'
    awk 'BEGIN { printf "%.17g %.17g\n", strtonum("0x10000000000000000"), strtonum("02000000000000000000000") }'
    awk 'BEGIN { match("x", /(a)?(b*)/, m); print (0 in m), (1 in m), (2 in m), "[" m[2] "]", m[2,"start"], m[2,"length"], ((1,"start") in m) }'
expect:
  stdout: |+
    2 2 1 b b 2 1 2 1
    123 -12.5 1000
    12.3 1200 128 8
    10 -10 10 0 0 16 0
    1.8446744073709552e+19 1.8446744073709552e+19
    1 0 1 [] 1 0 0
  stderr: |+
  exit_code: 0
