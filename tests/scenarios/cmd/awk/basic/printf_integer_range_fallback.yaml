description: awk handles general precision, unsigned range, and zero-precision printf edge cases.
input:
  script: |+
    awk 'BEGIN { printf "%d|%i|%u|%o|%x|%X\n", 1e20, 1e20, 1e20, 1e20, 1e20, 1e20; printf "[%#.0o]|[%#5.0o]|[%#.0x]|[%#.0X]\n", 0, 0, 0, 0; printf "[%#.0o]|[%#.0o]\n", .5, -.5 }'
    awk 'BEGIN { printf "[%#x]|[%#X]|[%#05x]|[%#x]|[%##x]\n", 0, 0, 0, .5, 0 }'
    awk 'BEGIN { printf "[%g]|[%+10G]|[%.7g]|[%s]|[%u]\n", 1.2345678, 1.2345678, 1.2345678, sprintf("%g", 1.2345678), 1.2345678e20 }'
expect:
  stdout: |+
    100000000000000000000|100000000000000000000|1e+20|1e+20|1e+20|1e+20
    [0]|[    0]|[]|[]
    [0]|[0]
    [0]|[0]|[00000]|[0x0]|[0]
    [1.23457]|[  +1.23457]|[1.234568]|[1.23457]|[1.23457e+20]
  stderr: |+
  exit_code: 0
