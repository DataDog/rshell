description: awk command pipes snapshot ENVIRON when each pipe is first opened.
input:
  interpreter_env:
    FOO: original
    NUMERIC_ENV: "012"
  script: |+
    awk 'BEGIN { ENVIRON["FOO"] = "input"; cmd = "echo $FOO"; cmd | getline x; print x; close(cmd) }'
    awk 'BEGIN { ENVIRON["FOO"] = "first"; cmd = "echo ${FOO}"; print "ignored" | cmd; ENVIRON["FOO"] = "later"; close(cmd) }'
    awk 'BEGIN { delete ENVIRON["FOO"]; cmd = "echo [$FOO]"; cmd | getline x; print x; close(cmd) }'
    SECRET=hidden
    awk 'BEGIN { cmd = "echo unexported=[$SECRET]"; cmd | getline x; print x; close(cmd) }'
    awk 'BEGIN { ENVIRON["FOO"] = 12; cmd = "echo \"numeric=[$FOO]\""; cmd | getline x; print x; close(cmd) }'
    awk 'BEGIN { ENVIRON["FOO"] = ENVIRON["NUMERIC_ENV"]; cmd = "echo \"strnum=[$FOO]\""; cmd | getline x; print x; close(cmd) }'
    awk 'BEGIN { ENVIRON["FOO"] = 12 ""; cmd = "echo \"coerced=[$FOO]\""; cmd | getline x; print x; close(cmd) }'
expect:
  stdout: |+
    input
    first
    []
    unexported=[]
    numeric=[]
    strnum=[012]
    coerced=[12]
  stderr: |+
  exit_code: 0
