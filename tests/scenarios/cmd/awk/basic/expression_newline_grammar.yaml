description: awk accepts newline continuations after logical operators and call commas only.
input:
  script: |+
    awk 'BEGIN { print 0 ||
    1; print 1 &&
    2; print sprintf("%s",
    "comma") }'
    awk 'BEGIN { print "unreachable"; print length(
    ) }' 2>/dev/null || printf 'open rejected\n'
    awk 'BEGIN { print "unreachable"; print length(1
    ) }' 2>/dev/null || printf 'close rejected\n'
expect:
  stdout: |+
    1
    1
    comma
    open rejected
    close rejected
  stderr: |+
  exit_code: 0
