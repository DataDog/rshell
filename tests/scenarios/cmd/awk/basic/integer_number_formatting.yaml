description: awk formats integer-valued numbers and materializes numeric format-variable string facets.
input:
  script: |+
    awk 'BEGIN { print 999999, 1000000, 123456789, 1000000.5; x=-0; print x, -1e-400; print 1e25 }'
    awk 'BEGIN { CONVFMT="%.2f"; OFMT=1.234; print 1.6; CONVFMT=1.234; print "[" CONVFMT "]"; printf "%.3f %.3f %d %d\n", OFMT+0, CONVFMT+0, OFMT==1.234, CONVFMT==1.234 }'
    awk 'BEGIN { print 0x10, 0XfF, 010, 018, 010.5, 010e1, 0x10 + 010 }'
    awk 'BEGIN { a="A"; g="G"; x2="X"; p3="P3"; print 0x1.2, 0x1.a, "[" 0x1.2g "]", "[" 0x1x2 "]", "[" 0x1.2p3 "]", 0x1.2e3, 0x1.2e+3 }'
expect:
  stdout: |+
    999999 1000000 123456789 1e+06
    0 0
    10000000000000000905969664
    1.23
    [1.23]
    1.234 1.234 1 1
    16 255 8 18 10.5 100 24
    1 1 [1G] [1] [1P3] 1 4
  stderr: |+
  exit_code: 0
