description: awk printf %c preserves malformed bytes and GNU awk's extended numeric character encoding and low-byte fallback.
input:
  script: |+
    awk 'BEGIN { printf "[%#c][%+c][% c][%3c][%-3c][%03c][%.0c][%c][%c][%c]\n", "\377tail", "\377tail", "\377tail", "\377tail", "\377tail", "\377tail", "\377tail", 65, "éclair", -1 }' | awk '{ print ($0 == "[\377][\377][\377][  \377][\377  ][  \377][\377][A][é][\377]") }'
    awk 'BEGIN { printf "[%3c][%-3c][%03c][%5c][%-5c]\n", 233, 233, 233, 8364, 128512 }'
    awk 'BEGIN { printf "[%3c][%-3c]\n", "é", "é" }'
    awk 'BEGIN { c4="\364\220\200\200"; c5="\370\210\200\200\200"; c6="\374\204\200\200\200\200"; print sprintf("%c%c%c",1114112,2097152,67108864)==(c4 c5 c6), sprintf("[%6c][%-6c]",1114112,1114112)=="[  " c4 "][" c4 "  ]" }'
expect:
  stdout: |+
    1
    [ é][é ][ é][  €][😀 ]
    [  é][é  ]
    1 1
  stderr: |+
  exit_code: 0
