description: Reading an unset array element creates it, so membership tests see it afterward.
skip_assert_against_bash: true  # intentional divergence: POSIX/gawk does NOT create the element on read; mawk does.
input:
  script: |+
    awk 'BEGIN { x = a[1]; print (1 in a), length(a) }'
expect:
  stdout: |+
    1 1
  stderr: |+
  exit_code: 0
