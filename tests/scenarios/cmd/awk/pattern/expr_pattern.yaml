description: An expression pattern selects records when the expression is truthy.
setup:
  files:
    - path: input.txt
      content: |+
        1 alpha
        2 beta
        3 gamma
        4 delta
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '$1 > 2 {print $2}' input.txt
expect:
  stdout: |+
    gamma
    delta
  stderr: ""
  exit_code: 0
