description: Multiple input files are concatenated; FILENAME and FNR track per-file.
setup:
  files:
    - path: a.txt
      content: |+
        x
        y
    - path: b.txt
      content: |+
        z
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{print FILENAME, FNR, NR, $0}' a.txt b.txt
expect:
  stdout: |+
    a.txt 1 1 x
    a.txt 2 2 y
    b.txt 1 3 z
  stderr: ""
  exit_code: 0
