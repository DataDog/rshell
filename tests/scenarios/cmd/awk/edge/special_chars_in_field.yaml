description: Fields with leading/trailing whitespace use default (space-runs) FS.
setup:
  files:
    - path: input.txt
      content: "   alpha  beta   gamma   \n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    awk '{print NF, "[" $1 "]", "[" $3 "]"}' input.txt
expect:
  stdout: |+
    3 [alpha] [gamma]
  stderr: ""
  exit_code: 0
