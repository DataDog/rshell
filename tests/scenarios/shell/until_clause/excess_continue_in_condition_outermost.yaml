description: In an until loop, continue N in the condition exits with status 0, which satisfies the until termination condition, so the loop exits after the first condition evaluation.
input:
  script: |+
    i=
    until i="${i}a"; [ "$i" = aaa ] && break; continue 99; do
      echo body
    done
    echo "i=$i"
expect:
  stdout: |+
    i=a
  stderr: |+
  exit_code: 0
