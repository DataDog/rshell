description: Excess continue N in a while condition at the outermost loop is clamped to continue 1 — the condition is re-evaluated rather than propagated outward.
input:
  script: |+
    i=
    while i="${i}a"; [ "$i" != aaa ] && true || break; continue 99; do
      echo body
    done
    echo "i=$i"
expect:
  stdout: |+
    i=aaa
  stderr: |+
  exit_code: 0
