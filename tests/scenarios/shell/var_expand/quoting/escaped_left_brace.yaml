description: Escaped left braces follow bash quote-removal and brace-expansion rules.
input:
  script: |+
    printf '<%s>\n' \{
    printf '<%s>\n' \{a,b}
    printf '<%s>\n' \\{a,b}
    printf '<%s>\n' \\\{a,b}
expect:
  stdout: |+
    <{>
    <{a,b}>
    <\a>
    <\b>
    <\{a,b}>
  stderr: |+
  exit_code: 0
