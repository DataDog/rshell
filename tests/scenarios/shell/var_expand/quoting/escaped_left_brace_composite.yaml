description: Escaped left braces work next to other word parts and sequence syntax.
input:
  script: |+
    X=ok
    printf '<%s>\n' \{\{
    printf '<%s>\n' \{{},}
    printf '<%s>\n' \{{}x,y}
    printf '<%s>\n' \{{x},}
    printf '<%s>\n' \{{x},z}
    printf '<%s>\n' \{{"x"},}
    printf '<%s>\n' \{{$X},z}
    printf '<%s>\n' \{{a\,b},}
    printf '<%s>\n' \{{a\}}
    printf '<%s>\n' \{{a\},}
    printf '<%s>\n' \{{a\},z}
    printf '<%s>\n' \{{1..3},}
    printf '<%s>\n' \{{1\..3},}
    printf '<%s>\n' \\\{{},}
    printf '<%s>\n' \{"x"
    printf '<%s>\n' \{$X
    printf '<%s>\n' \{1..3}
    printf '<%s>\n' \\{1..3}
expect:
  stdout: |+
    <{{>
    <{}>
    <{>
    <{}x>
    <{y>
    <{x}>
    <{>
    <{x}>
    <{z>
    <{x}>
    <{>
    <{ok}>
    <{z>
    <{a,b}>
    <{>
    <{{a}}>
    <{a}>
    <{>
    <{a}>
    <{z>
    <{1,}>
    <{2,}>
    <{3,}>
    <{1..3}>
    <{>
    <\{}>
    <\{>
    <{x>
    <{ok>
    <{1..3}>
    <\1>
    <\2>
    <\3>
  stderr: |+
  exit_code: 0
