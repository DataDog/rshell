# skip: error message format differs from bash (rshell uses different command-not-found format)
skip_assert_against_bash: true
description: Unknown command after valid command still produces error.
input:
  script: |+
    echo before
    no_such_cmd_abc
    echo after
expect:
  stdout: |+
    before
    after
  stderr: |+
    rshell: no_such_cmd_abc: unknown command
    Run 'help' to see available commands.
  exit_code: 0
