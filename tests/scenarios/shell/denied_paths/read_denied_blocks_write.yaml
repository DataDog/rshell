# skip: denied_paths sandbox restriction is an rshell-specific feature not present in bash
skip_assert_against_bash: true
description: DeniedPaths read-deny also blocks writes in remediation mode.
setup:
  files:
    - path: allowed/secret/data.txt
      content: "secret\n"
input:
  allowed_paths: ["allowed:rw"]
  denied_paths: ["allowed/secret:r"]
  mode: remediation
  script: |+
    echo changed > allowed/secret/data.txt
expect:
  stdout: |+
  stderr_contains: ["permission denied"]
  exit_code: 1
