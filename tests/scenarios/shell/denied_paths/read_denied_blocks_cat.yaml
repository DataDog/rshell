# skip: denied_paths sandbox restriction is an rshell-specific feature not present in bash
skip_assert_against_bash: true
description: DeniedPaths read-deny blocks reading a child of an allowed path.
setup:
  files:
    - path: allowed/public.txt
      content: "public\n"
    - path: allowed/secret/data.txt
      content: "secret\n"
input:
  allowed_paths: ["allowed"]
  denied_paths: ["allowed/secret:r"]
  script: |+
    cat allowed/public.txt
    cat allowed/secret/data.txt
expect:
  stdout: |+
    public
  stderr_contains: ["permission denied"]
  exit_code: 1
