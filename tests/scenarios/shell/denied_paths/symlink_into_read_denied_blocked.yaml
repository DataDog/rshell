# skip: denied_paths sandbox restriction is an rshell-specific feature not present in bash
skip_assert_against_bash: true
description: Symlinks cannot bypass a read-denied subtree.
setup:
  files:
    - path: allowed/secret/data.txt
      content: "secret\n"
    - path: allowed/link.txt
      symlink: secret/data.txt
input:
  allowed_paths: ["allowed"]
  denied_paths: ["allowed/secret:r"]
  script: |+
    cat allowed/link.txt
expect:
  stdout: |+
  stderr_contains: ["permission denied"]
  exit_code: 1
