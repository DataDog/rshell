# skip: AllowedCommands is rshell-specific; bash has no equivalent.
description: A blocked command in an AND chain short-circuits subsequent commands.
skip_assert_against_bash: true
input:
  allowed_commands:
    - rshell:echo
  script: |+
    cat /dev/null && echo unreached
expect:
  stdout: ""
  stderr: |+
    rshell: cat: command not allowed
  exit_code: 127
