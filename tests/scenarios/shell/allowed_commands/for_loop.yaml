# skip: AllowedCommands is rshell-specific; bash has no equivalent.
description: An allowed command runs across all iterations of a for-loop.
skip_assert_against_bash: true
input:
  allowed_commands:
    - rshell:echo
  script: |+
    for x in a b c; do
      echo $x
    done
expect:
  stdout: |+
    a
    b
    c
  stderr: ""
  exit_code: 0
