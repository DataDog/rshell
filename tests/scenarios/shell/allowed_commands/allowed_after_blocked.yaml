skip_assert_against_bash: true
description: Execution continues after a blocked command (non-fatal).
input:
  allowed_commands:
    - rshell:echo
  script: |+
    cat /dev/null
    echo after
expect:
  stdout: |+
    after
  stderr_contains:
    - "cat /dev/null: invocation not permitted by policy"
  exit_code: 0
