description: Leading and adjacent non-whitespace IFS delimiters preserve empty arguments, with quotes and adjoining literals.
input:
  script: |+
    IFS=:
    x=':a::b:'
    printf '<%s>\n' $x "$x" pre${x}post
expect:
  stdout: |+
    <>
    <a>
    <>
    <b>
    <:a::b:>
    <pre>
    <a>
    <>
    <b>
    <post>
  stderr: |+
  exit_code: 0
