description: Leading and consecutive non-whitespace IFS delimiters preserve empty fields; a trailing delimiter only terminates the last field.
input:
  script: |+
    IFS=:
    for A in '' ':' '::' ':a::b:' 'a::b' 'a::'; do
      printf 'value=<%s>\n' "$A"
      for w in $A; do printf '[%s]\n' "$w"; done
    done
    x=':a::b:'
    printf '<%s>\n' $x
    IFS=; x='a b'; printf '<%s>\n' $x
expect:
  stdout: |+
    value=<>
    value=<:>
    []
    value=<::>
    []
    []
    value=<:a::b:>
    []
    [a]
    []
    [b]
    value=<a::b>
    [a]
    []
    [b]
    value=<a::>
    [a]
    []
    <>
    <a>
    <>
    <b>
    <a b>
  stderr: |+
  exit_code: 0
