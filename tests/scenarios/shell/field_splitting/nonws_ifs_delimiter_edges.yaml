description: Delimiter-only, trailing, and Unicode IFS separators preserve the Bash argument boundaries.
input:
  script: |+
    IFS=:
    for x in '' ':' '::' 'a:' 'a::'; do
      echo next
      for w in $x; do printf '<%s>\n' "$w"; done
    done
    IFS=é
    x='éaééb é'
    printf '<%s>\n' $x
    IFS=$(printf '\r\v\f:')
    x=$(printf '\r:\v:\fa:\r')
    printf '<%s>\n' $x
expect:
  stdout: |+
    next
    next
    <>
    next
    <>
    <>
    next
    <a>
    next
    <a>
    <>
    <>
    <a>
    <>
    <b >
    <>
    <>
    <a>
  stderr: |+
  exit_code: 0
