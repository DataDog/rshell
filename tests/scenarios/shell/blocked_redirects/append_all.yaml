# skip: sandbox blocks writes to paths outside AllowedPaths; bash has no equivalent restriction
skip_assert_against_bash: true
description: Append all (&>>) is blocked when target is outside AllowedPaths.
input:
  script: |+
    echo hello &>> output.txt
expect:
  stdout: ""
  stderr: |+
    open output.txt: permission denied
  exit_code: 1
