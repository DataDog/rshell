# skip: sandbox redirect support is rshell-specific; bash has no AllowedPaths restriction
skip_assert_against_bash: true
description: A blocked redirect fails the offending command but does not abort the script.
input:
  script: |+
    echo before
    echo data > output.txt
    echo after
expect:
  stdout: |+
    before
    after
  stderr: |+
    open output.txt: permission denied
  exit_code: 0
