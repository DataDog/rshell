# skip: sandbox blocks writes to paths outside AllowedPaths; bash has no equivalent restriction
skip_assert_against_bash: true
description: Output redirection with variable filename is blocked when target is outside AllowedPaths.
input:
  script: |+
    F=out.txt
    echo hello > "$F"
expect:
  stdout: ""
  stderr: |+
    open out.txt: permission denied
  exit_code: 1
