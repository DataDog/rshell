# skip: sandbox blocks writes to paths outside AllowedPaths; bash has no equivalent restriction
skip_assert_against_bash: true
description: Append redirection with variable filename is blocked when outside AllowedPaths.
input:
  script: |+
    F=file.txt
    echo hello >> "$F"
expect:
  stdout: ""
  stderr: |+
    open file.txt: permission denied
  exit_code: 1
