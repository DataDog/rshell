# skip: sandbox redirect support is rshell-specific; bash has no AllowedPaths restriction
skip_assert_against_bash: true
description: Variable expansion in redirect target works at runtime; sandbox blocks writes outside AllowedPaths.
input:
  script: |+
    TARGET=out.txt
    echo hello > $TARGET
expect:
  stdout: ""
  stderr: |+
    open out.txt: permission denied
  exit_code: 1
