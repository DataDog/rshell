# skip: sandbox blocks writes to paths outside AllowedPaths; bash has no equivalent restriction
skip_assert_against_bash: true
description: Stderr redirection (2>) is blocked when target is outside AllowedPaths.
input:
  script: |+
    echo hello 2> errors.txt
expect:
  stdout: ""
  stderr: |+
    open errors.txt: permission denied
  exit_code: 1
