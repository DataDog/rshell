skip_assert_against_bash: true
description: |
  Pattern targets a specific subcommand; invocations of a sibling
  subcommand are blocked. Pattern [ip, route] admits "ip route show"
  but rejects "ip addr show" because the token "route" does not appear
  anywhere in the argv.
input:
  allowed_command_patterns:
    - ["ip", "route"]
  script: |+
    ip addr
expect:
  stdout: ""
  stderr_contains:
    - "ip addr: invocation not permitted by policy"
    - "allowed patterns for \"ip\": 'ip route'"
  exit_code: 127
