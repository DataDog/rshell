skip_assert_against_bash: true
description: |
  Partner case to pattern_blocks_substitution_escape: a substitution that
  expands to an argv satisfying the pattern is allowed. Confirms the
  matcher inspects the resolved argv rather than blanket-rejecting
  interpolation.
input:
  allowed_commands:
    - rshell:printf
  allowed_command_patterns:
    - ["ip", "route"]
  script: |+
    $(printf ip) route show
expect:
  # ip route reports its own platform-specific error on macOS; the
  # important thing is that the policy gate ALLOWED the call (exit
  # code is whatever ip returns, NOT 127).
  stdout: ""
  stderr_contains:
    - "route table reading is not supported"
  exit_code: 1
