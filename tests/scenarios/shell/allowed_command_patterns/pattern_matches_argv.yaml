skip_assert_against_bash: true
description: |
  An invocation whose argv satisfies a (command, subcommand) pattern is
  allowed. Pattern (ip, route) admits "ip route show". The ip builtin
  has a registered CommandSpec, so multi-token patterns referencing it
  are accepted at runner construction time.
input:
  allowed_command_patterns:
    - ["ip", "route"]
  script: |+
    ip route show
expect:
  # ip route reports its own platform-specific error on macOS; the
  # important thing is that the policy gate ALLOWED the call (exit
  # code is whatever ip returns, NOT 127).
  stdout: ""
  stderr_contains:
    - "route table reading is not supported"
  exit_code: 1
