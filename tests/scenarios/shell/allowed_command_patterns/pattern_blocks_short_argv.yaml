skip_assert_against_bash: true
description: |
  An argv shorter than the pattern cannot match (length check). Pattern
  (ip, route) requires a structural token after "ip"; bare "ip" with no
  subcommand does not satisfy it.
input:
  allowed_command_patterns:
    - ["ip", "route"]
  script: |+
    ip
expect:
  stdout: ""
  stderr: |+
    rshell: ip: command not allowed
  exit_code: 127
