description: $(<file) shortcut is rejected at validation even when combined with other assignments.
skip_assert_against_bash: true
setup:
  files:
    - path: ok.txt
      content: "hello"
input:
  allowed_paths: ["$DIR"]
  script: |+
    a=$(false) b=$(<ok.txt)
    echo "$?"
expect:
  stdout: ""
  stderr_contains:
    - "file-reading command"
  exit_code: 2
