description: $(<dir) is also rejected at validation because it uses the blocked $(<file) shortcut.
skip_assert_against_bash: true
setup:
  files:
    - path: subdir/placeholder.txt
      content: "placeholder"
input:
  allowed_paths: ["$DIR"]
  script: |+
    x=$(<subdir)
    echo "[$x]"
expect:
  stdout: ""
  stderr_contains:
    - "file-reading command"
  exit_code: 2
