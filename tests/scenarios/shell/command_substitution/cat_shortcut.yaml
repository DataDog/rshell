description: $(<file) is rejected because it bypasses the command allowlist; use $(cat file) instead.
skip_assert_against_bash: true
setup:
  files:
    - path: data.txt
      content: "file content here"
input:
  allowed_paths: ["$DIR"]
  script: |+
    x=$(<data.txt)
    echo "$x"
expect:
  stdout: ""
  stderr_contains:
    - "file-reading command"
  exit_code: 2
