description: The $(<file) shortcut is rejected; $(cat file) is the allowed equivalent and still strips trailing newlines.
setup:
  files:
    - path: trailing.txt
      content: "hello\n\n\n"
input:
  allowed_paths: ["$DIR"]
  script: |+
    x=$(cat trailing.txt)
    echo "[$x]"
expect:
  stdout: |+
    [hello]
  stderr: ""
  exit_code: 0
