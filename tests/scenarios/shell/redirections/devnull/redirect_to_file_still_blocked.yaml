# skip: sandbox redirect support is rshell-specific; bash has no AllowedPaths restriction
skip_assert_against_bash: true
description: Output redirection to a path outside AllowedPaths is blocked at runtime.
input:
  script: |+
    echo hello > /tmp/output.txt
expect:
  stdout: ""
  stderr: |+
    open /tmp/output.txt: permission denied
  exit_code: 1
