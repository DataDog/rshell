# skip: sandbox redirect support is rshell-specific; bash has no AllowedPaths restriction
skip_assert_against_bash: true
description: Path traversal via /dev/null/.. is not recognized as /dev/null and the sandbox blocks the open.
input:
  script: |+
    echo hello > /dev/null/../../../tmp/evil
expect:
  stdout: ""
  stderr: |+
    open /dev/null/../../../tmp/evil: permission denied
  exit_code: 1
