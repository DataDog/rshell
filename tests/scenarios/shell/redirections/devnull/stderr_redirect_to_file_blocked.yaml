# skip: sandbox redirect support is rshell-specific; bash has no AllowedPaths restriction
skip_assert_against_bash: true
description: Stderr redirection to a path outside AllowedPaths is blocked at runtime.
input:
  script: |+
    echo hello 2> /tmp/errors.txt
expect:
  stdout: ""
  stderr: |+
    open /tmp/errors.txt: permission denied
  exit_code: 1
