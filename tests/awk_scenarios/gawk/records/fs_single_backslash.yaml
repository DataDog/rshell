description: a single backslash field separator splits on literal backslashes
upstream:
  suite: gawk
  id: test/fsbs.awk
  ref: gawk-5.4.0
covers:
  - FS can be set to a regexp for a literal backslash
  - fields on either side of the backslash remain intact
input:
  program: |
    BEGIN { FS = "\\" }
    { print $1 ":" $2 }
  stdin: |
    left\right
expect:
  stdout: |
    left:right
  exit_code: 0
