description: rebuilding an FPAT-split record joins fields with OFS
upstream:
  suite: gawk
  id: test/fpat5.awk
  ref: gawk-5.4.0
covers:
  - assigning a field after FPAT splitting rebuilds $0
  - rebuilt records use OFS between FPAT-derived fields
input:
  program: |
    BEGIN {
      FPAT = "([^,]*)|(\"[^\"]+\")"
      OFS = ";"
    }
    { $1 = $1; print }
  stdin: |
    "red","blue","green"
expect:
  stdout: |
    "red";"blue";"green"
  exit_code: 0
