description: print redirection writes separate odd and even output files
upstream:
  suite: onetrueawk
  id: testdir/t.redir1
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "print > file writes matching records to a named file"
  - "close(file) allows the program to reread redirected output"
input:
  program: |
    { if ($1 % 2 == 1) print > "odd.out"; if ($1 % 2 == 0) print > "even.out" } END { close("odd.out"); close("even.out"); while ((getline line < "odd.out") > 0) print "odd:" line; while ((getline line < "even.out") > 0) print "even:" line }
  stdin: "1 one\n2 two\n3 three\n4 four\n"
expect:
  stdout: "odd:1 one\nodd:3 three\neven:2 two\neven:4 four\n"
  exit_code: 0
