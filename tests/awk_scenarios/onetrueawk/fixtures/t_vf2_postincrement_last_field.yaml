description: postincrement on $NF updates the last field after yielding its old value
upstream:
  suite: onetrueawk
  id: testdir/t.vf2
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "$NF addresses the current last field dynamically"
  - "postincrement on a field returns the old value and stores the incremented value"
input:
  program: |
    { print $NF++; print $NF }
  stdin: "item 5\n7\n"
expect:
  stdout: "5\n6\n7\n8\n"
  exit_code: 0
