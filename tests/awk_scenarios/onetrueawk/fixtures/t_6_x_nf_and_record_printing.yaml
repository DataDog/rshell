description: NF and the original record are printable for normal and empty records
upstream:
  suite: onetrueawk
  id: testdir/t.6.x
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "NF is zero for an empty input record"
  - "printing $0 preserves the current record text"
input:
  program: |
    { print NF, $0 }
  stdin: "alpha beta\n\n gamma \n"
expect:
  stdout: "2 alpha beta\n0 \n1  gamma \n"
  exit_code: 0
