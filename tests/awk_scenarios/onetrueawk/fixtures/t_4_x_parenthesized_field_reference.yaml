description: parenthesized numeric expression addresses a field
upstream:
  suite: onetrueawk
  id: testdir/t.4.x
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "$(1) resolves to the first field"
  - "dynamic field references can be assigned to variables"
input:
  program: |
    { i = $(1); print i }
  stdin: "left right\nsolo\n"
expect:
  stdout: "left\nsolo\n"
  exit_code: 0
