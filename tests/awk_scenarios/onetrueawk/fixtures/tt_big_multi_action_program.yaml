description: multiple independent rules all run over the same records
upstream:
  suite: onetrueawk
  id: testdir/tt.big
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "several action blocks can fire for one record"
  - "pattern-only conditions interleave with actions"
  - "END aggregates state built by earlier actions"
input:
  program: |
    { print "raw:" $0 } { print "stats", NR, NF } { total += $3 } NF % 2 == 0 { print "even-fields:" $0 } /.$/ { print "head", substr($0, 1, 3) } { rev = ""; for (i = NF; i > 0; i--) rev = rev (rev == "" ? "" : "|") $i; print "rev", rev } END { print "sum", total }
  stdin: "a b 3 d\nx y 4\n"
expect:
  stdout: "raw:a b 3 d\nstats 1 4\neven-fields:a b 3 d\nhead a b\nrev d|3|b|a\nraw:x y 4\nstats 2 3\nhead x y\nrev 4|y|x\nsum 7\n"
  exit_code: 0
