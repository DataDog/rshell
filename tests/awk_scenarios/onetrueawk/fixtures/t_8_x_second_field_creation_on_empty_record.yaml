description: assigning $2 from $1 creates fields even for an empty record
upstream:
  suite: onetrueawk
  id: testdir/t.8.x
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "assigning a higher field creates intervening fields"
  - "an empty record rebuilt after $2 assignment contains the field separator"
input:
  program: |
    { $2 = $1; print }
  stdin: "alpha beta\n\nsolo\n"
expect:
  stdout: "alpha alpha\n \nsolo solo\n"
  exit_code: 0
