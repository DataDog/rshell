description: split array entries coexist with composite-subscript membership checks
upstream:
  suite: onetrueawk
  id: testdir/t.intest2
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "split populates numeric array indexes"
  - "($0,$1) in array tests a composite SUBSEP subscript"
  - "a scalar-looking key is distinct from the composite key"
input:
  program: |
    { tail = substr($0, index($0, " ") + 1); n = split(tail, x); x[$0, $1] = $0; print n, x[1], x[2]; print (($0, $1) in x ? "composite-present" : "composite-missing"); print ($1 in x ? "single-present" : "single-missing") }
  stdin: "key red blue\n"
expect:
  stdout: "2 red blue\ncomposite-present\nsingle-missing\n"
  exit_code: 0
