description: split with an explicit whitespace regex agrees with field splitting
upstream:
  suite: onetrueawk
  id: testdir/t.split8
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "split can use a regular expression separator"
  - "split fields match default field references for simple whitespace records"
input:
  program: |
    { n = split($0, x, /[ \t]+/); print n; if (n != NF) print "split botch", NR, n, NF; for (i = 1; i <= n; i++) if ($i != x[i]) print "different", i, x[i], $i }
  stdin: "alpha beta\none\ttwo three\n"
expect:
  stdout: "2\n3\n"
  exit_code: 0
