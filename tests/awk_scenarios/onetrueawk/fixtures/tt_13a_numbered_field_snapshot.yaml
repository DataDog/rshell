description: fields copied into an array can be printed with indexes
upstream:
  suite: onetrueawk
  id: testdir/tt.13a
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "for loops can snapshot fields into an array"
  - "printf formats numeric indexes beside array values"
input:
  program: |
    { for (i = 1; i <= NF; i++) x[i] = $i; for (i = 1; i <= NF; i++) printf "%d %s\n", i, x[i] }
  stdin: "red green\nsolo\n"
expect:
  stdout: "1 red\n2 green\n1 solo\n"
  exit_code: 0
