description: assigning $3 from arithmetic rebuilds records with OFS
upstream:
  suite: onetrueawk
  id: testdir/t.makef
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "field assignment can extend records that lack that field"
  - "arithmetic expressions assigned to fields are stringified in rebuilt $0"
input:
  program: |
    { $3 = 2 * $1; print $1, $2, $3, $0 }
  stdin: "3 apples old\n5 pears\n"
expect:
  stdout: "3 apples 6 3 apples 6\n5 pears 10 5 pears 10\n"
  exit_code: 0
