description: numeric pattern guards sqrt calls for positive first fields
upstream:
  suite: onetrueawk
  id: testdir/t.f.x
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "numeric comparisons coerce the first field"
  - "sqrt is evaluated only for matching records"
input:
  program: |
    $1 > 0 { print $1, sqrt($1) }
  stdin: "9\n0\n16\n-4\n"
expect:
  stdout: "9 3\n16 4\n"
  exit_code: 0
