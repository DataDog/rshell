description: dynamic field reads can be repeated by separate actions
upstream:
  suite: onetrueawk
  id: testdir/t.vf
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "$(i+i) reads a field chosen at run time"
  - "multiple action blocks run for the same input record"
input:
  program: |
    BEGIN { i = 1 } { print $(i + i) } { print $(1) }
  stdin: "left right third\nsolo\n"
expect:
  stdout: "right\nleft\n\nsolo\n"
  exit_code: 0
