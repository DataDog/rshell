description: split using FS agrees with current fields for default whitespace
upstream:
  suite: onetrueawk
  id: testdir/t.split9
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "split accepts FS as its separator argument"
  - "the special space FS behavior is mirrored by split"
input:
  program: |
    { n = split($0, x, FS); print n, NF, x[1], x[n]; if (n != NF) print "botch", NR, n, NF; for (i = 1; i <= n; i++) if ($i != x[i]) print "diff", i, x[i], $i }
  stdin: "alpha beta\none two three\n"
expect:
  stdout: "2 2 alpha beta\n3 3 one three\n"
  exit_code: 0
