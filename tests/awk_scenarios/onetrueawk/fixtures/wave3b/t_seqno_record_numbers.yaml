description: NR prefixes every input record including empty records
upstream:
  suite: onetrueawk
  id: testdir/t.seqno
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "NR increments for each record read"
  - "empty records still run the default action body"
input:
  program: |
    { print NR, $0 }
  stdin: "first\nsecond line\n\nthird\n"
expect:
  stdout: "1 first\n2 second line\n3 \n4 third\n"
  exit_code: 0
