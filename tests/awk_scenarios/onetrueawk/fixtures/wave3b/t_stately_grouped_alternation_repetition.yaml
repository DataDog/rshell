description: grouped alternation can be repeated in an anchored regex
upstream:
  suite: onetrueawk
  id: testdir/t.stately
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "a parenthesized alternation may be followed by *"
  - "anchored token repetition rejects unknown tokens"
input:
  program: |
    /^(ny|ca|tx|-)*$/ { print "codes", $0 }
  stdin: "nycatx\nny-fl\nca-ny\ntxnyca\n"
expect:
  stdout: "codes nycatx\ncodes ca-ny\ncodes txnyca\n"
  exit_code: 0
