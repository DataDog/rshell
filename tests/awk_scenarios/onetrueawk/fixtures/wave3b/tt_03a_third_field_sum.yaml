description: third-field numeric values sum in END
upstream:
  suite: onetrueawk
  id: testdir/tt.03a
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "numeric addition coerces $3"
  - "END observes totals accumulated over all records"
input:
  program: |
    { s += $3 } END { print s }
  stdin: "a b 3\nc d 4.5\ne f -1\n"
expect:
  stdout: "6.5\n"
  exit_code: 0
