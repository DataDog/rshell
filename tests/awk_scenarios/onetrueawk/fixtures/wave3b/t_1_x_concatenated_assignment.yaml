description: concatenated assignment uses field values before printing the record
upstream:
  suite: onetrueawk
  id: testdir/t.1.x
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "string concatenation can appear on the right side of assignment"
  - "comma-separated print uses OFS between expressions"
input:
  program: |
    { i = "count" $1 $2; print i, $0 }
  stdin: "red 7\nblue 11\n"
expect:
  stdout: "countred7 red 7\ncountblue11 blue 11\n"
  exit_code: 0
