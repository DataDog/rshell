description: log values accumulate across records and print again in END
upstream:
  suite: onetrueawk
  id: testdir/t.i.x
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "numeric pattern filters positive records"
  - "log results can be accumulated and reused in END"
input:
  program: |
    $1 + 0 > 0 { i = i + log($1); print i, log($1) } END { print i }
  stdin: "1\n10\n100\n-5\n"
expect:
  stdout: "0 0\n2.30259 2.30259\n6.90776 4.60517\n6.90776\n"
  exit_code: 0
