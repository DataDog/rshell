description: numeric literals and uninitialized variables convert predictably during concatenation
upstream:
  suite: onetrueawk
  id: testdir/t.strnum
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "scientific notation literals convert to strings through concatenation"
  - "uninitialized variables concatenate as empty strings"
  - "default numeric string conversion uses CONVFMT"
input:
  program: |
    BEGIN {
      print "[" 2E3 "]"
      print "[" 7.5e-1 "]"
      print "[" missing42 "]"
      print "[" 3.14159265 "]"
    }
expect:
  stdout: |
    [2000]
    [0.75]
    []
    [3.14159]
  exit_code: 0
