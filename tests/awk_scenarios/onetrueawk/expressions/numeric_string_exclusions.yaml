description: numeric-looking fields compare numerically against numeric constants
upstream:
  suite: onetrueawk
  id: testdir/t.strcmp1
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "fields with numeric strings compare numerically to numeric constants"
  - "logical AND can exclude several numeric values"
  - "nonexcluded records continue to later actions"
input:
  program: |
    $1 != 10 && $1 != 20 && $1 != 30 { print "other", $1 }
  stdin: |
    10 keep
    15 show
    20 keep
    x show
    30 keep
expect:
  stdout: |
    other 15
    other x
  exit_code: 0
