description: compound assignment operators update numeric variables
upstream:
  suite: onetrueawk
  id: testdir/t.addops
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - +=, -=, *=, and /= update variables in place
  - ^= and **= perform exponentiation assignment
  - compound assignments produce numeric values
input:
  program: |
    BEGIN {
      n = 6
      n += 4
      print n
      n -= 3
      print n
      n *= 2.5
      print n
      n /= 7
      print n
      n = 4
      n ^= 2
      print n
      n **= 0.5
      print n
    }
expect:
  stdout: |
    10
    7
    17.5
    2.5
    16
    4
  exit_code: 0
