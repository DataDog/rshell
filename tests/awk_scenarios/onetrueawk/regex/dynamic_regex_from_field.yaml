description: regex strings built from fields are used by later pattern rules on the same record
upstream:
  suite: onetrueawk
  id: testdir/t.re3
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "a scalar string can be used as the right side of ~"
  - "dynamic regex values can include punctuation and repetitions"
  - "rules run in order for each record"
input:
  program: |
    {
      word = $1
      tagged = $1 "-[0-9]+"
    }

    $0 ~ word { print "word", word, $0 }
    $0 ~ tagged { print "tagged", tagged, $0 }
  stdin: |
    cat cat-7
    dog catalog
    zip zip-a
expect:
  stdout: |
    word cat cat cat-7
    tagged cat-[0-9]+ cat cat-7
    word dog dog catalog
    word zip zip zip-a
  exit_code: 0
