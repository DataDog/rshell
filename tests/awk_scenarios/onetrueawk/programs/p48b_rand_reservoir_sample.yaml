description: seeded rand drives a bounded reservoir-style selection loop
upstream:
  suite: onetrueawk
  id: testdir/p.48b
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "srand makes rand-driven selection deterministic"
  - "rand results can be compared inside an action"
  - "exit stops the sampling loop once the remaining count is exhausted"
input:
  program: |
    BEGIN { srand(1); k = 3; n = 10 }
    {
      if (n <= 0) exit
      if (rand() <= k/n) {
        print
        k--
      }
      n--
    }
  stdin: |
    item1
    item2
    item3
    item4
    item5
    item6
    item7
    item8
    item9
    item10
expect:
  stdout: |
    item3
    item7
    item8
  exit_code: 0
