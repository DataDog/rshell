description: BEGIN header and formatted rows use tab-separated fields
upstream:
  suite: onetrueawk
  id: testdir/p.5
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "BEGIN header and formatted rows use tab-separated fields"
  - "uses original rshell fixture data rather than upstream country records"
input:
  program: |
    BEGIN { FS = "\t"; printf "|%-8s|%5s|%5s|%-6s|\n", "NAME", "AREA", "POP", "ZONE" }
    { printf "|%-8s|%5d|%5d|%-6s|\n", $1, $2, $3, $4 }
  stdin: |
    Aster	40	12	inner
    Boreal	80	66	outer
    Crux	55	101	outer
    Dune	abc	9	Dune
    Mica	12	5	inner
    Nova	70	70	Nova
expect:
  stdout: |
    |NAME    | AREA|  POP|ZONE  |
    |Aster   |   40|   12|inner |
    |Boreal  |   80|   66|outer |
    |Crux    |   55|  101|outer |
    |Dune    |    0|    9|Dune  |
    |Mica    |   12|    5|inner |
    |Nova    |   70|   70|Nova  |
  exit_code: 0
