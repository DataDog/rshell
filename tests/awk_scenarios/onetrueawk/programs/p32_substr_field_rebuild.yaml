description: assigning a substring to a field rebuilds the current record
upstream:
  suite: onetrueawk
  id: testdir/p.32
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "substr can derive a replacement field value"
  - "field assignment rebuilds $0 using the output field separator"
input:
  program: |
    { $1 = substr($1, 1, 3); print }
  stdin: |
    magenta 10 north
    blue 20 south
expect:
  stdout: |
    mag 10 north
    blu 20 south
  exit_code: 0
