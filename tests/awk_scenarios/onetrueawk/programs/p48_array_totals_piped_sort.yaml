description: accumulated array totals are written through a sort pipeline
upstream:
  suite: onetrueawk
  id: testdir/p.48
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "array elements indexed by fields accumulate totals"
  - "print can pipe output to an external command"
  - "pipeline output provides deterministic sorted records"
input:
  program: |
    BEGIN { FS = "	" }
    { pop[$4] += $3 }
    END {
      for (c in pop)
        print c ":" pop[c] | "sort"
    }
  stdin: |
    Aster	40	12	inner
    Boreal	80	66	outer
    Crux	55	101	outer
expect:
  stdout: |
    inner:12
    outer:167
  exit_code: 0
