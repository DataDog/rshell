description: a compact formula scanner totals atoms from chemistry-style records
upstream:
  suite: onetrueawk
  id: testdir/T.chem
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "adjacent element symbols and numeric suffixes are scanned from each formula"
  - "missing numeric suffixes count as one atom"
  - "per-record totals are reset between formulas"
input:
  program: |
    function add(atom, count) {
      if (count == "") count = 1
      totals[atom] += count
    }
    {
      rest = $1
      while (match(rest, /[A-Z][a-z]?[0-9]*/)) {
        token = substr(rest, RSTART, RLENGTH)
        match(token, /^[A-Z][a-z]?/)
        atom = substr(token, RSTART, RLENGTH)
        count = substr(token, RLENGTH + 1)
        add(atom, count)
        rest = substr(rest, RSTART + RLENGTH)
      }
      print $1, "C=" totals["C"] + 0, "H=" totals["H"] + 0, "N=" totals["N"] + 0, "O=" totals["O"] + 0
      delete totals
    }
  stdin: |
    C6H12O6
    C8H10N4O2
    H2O
expect:
  stdout: |
    C6H12O6 C=6 H=24 N=0 O=18
    C8H10N4O2 C=8 H=20 N=12 O=4
    H2O C=0 H=2 N=0 O=2
  exit_code: 0
