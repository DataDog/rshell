description: a for loop iterates across every field in each record
upstream:
  suite: onetrueawk
  id: testdir/p.40
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "for loops can index fields from one through NF"
  - "field references using a variable index produce each field value"
input:
  program: |
    { for (i = 1; i <= NF; i++) print $i }
  stdin: |
    one two
    three four five
expect:
  stdout: |
    one
    two
    three
    four
    five
  exit_code: 0
