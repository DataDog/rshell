description: builtins coerce strings, handle math, and report array lengths
upstream:
  suite: onetrueawk
  id: testdir/T.builtin
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "math builtins produce stable numeric values"
  - "index and substr cooperate on numeric strings"
  - "tolower, toupper, split, and length operate on record data"
input:
  program: |
    BEGIN {
      pi = 2 * atan2(1, 0)
      printf "%.5f %.3f %.3f %.2f\n", pi, sin(pi), cos(pi / 2), log(exp(4))
      print index(98765, substr(98765, 3, 2))
    }
    {
      n = split($0, words)
      print tolower($0), toupper($0), length(words)
    }
  stdin: |
    Hello MIX
    one two three
expect:
  stdout: |
    3.14159 0.000 0.000 4.00
    3
    hello mix HELLO MIX 2
    one two three ONE TWO THREE 3
  exit_code: 0
