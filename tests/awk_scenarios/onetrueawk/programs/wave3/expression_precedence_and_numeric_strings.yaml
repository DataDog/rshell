description: expression coercion covers ternary, boolean, and unary-not precedence
upstream:
  suite: onetrueawk
  id: testdir/T.expr
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "numeric strings compare numerically against numeric constants"
  - "logical operators preserve awk truth rules for strings and numbers"
  - "unary ! binds before addition"
input:
  program: |
    BEGIN { FS = "	" }
    {
      verdict = ($1 == 1) ? "one" : "not"
      print verdict, ($1 || $2), ($1 && $2), !$1 + $2
    }
  stdin: |
    1	0
    0	3
    01	2
    abc	0
expect:
  stdout: |
    one 1 0 0
    not 1 0 4
    one 1 1 2
    not 1 0 0
  exit_code: 0
