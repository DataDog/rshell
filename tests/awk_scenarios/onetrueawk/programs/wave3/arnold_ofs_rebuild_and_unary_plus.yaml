description: field rebuild and numeric formatting fixes from Arnold-style cases
upstream:
  suite: onetrueawk
  id: testdir/T.arnold
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "field assignment rebuilds $0 using the OFS in force at assignment time"
  - "OFMT controls numeric print conversion"
  - "unary plus coerces string operands numerically"
input:
  program: |
    BEGIN {
      OFS = ":"
      $0 = "north south east west"
      $3 = "CENTER"
      OFS = "|"
      print $0
      OFMT = "%.0f"
      print 5.7
      print +"not-a-number", +"42.125"
    }
expect:
  stdout: |
    north:south:CENTER:west
    6
    0|42
  exit_code: 0
