description: gawk-derived cases cover backslash replacement and field reparsing
upstream:
  suite: onetrueawk
  id: testdir/T.gawk
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "gsub can replace literal backslashes without losing neighboring text"
  - "assigning a modified record back to $0 reparses fields"
input:
  program: |
    /\\/ {
      x = $0
      gsub(/\\/, "B", x)
      print x
      next
    }
    {
      gsub(/x/, " ")
      $0 = $0
      print NF, $1, $2, $3
    }
  stdin: |
    a\b
    1x2x3
expect:
  stdout: |
    aBb
    3 1 2 3
  exit_code: 0
