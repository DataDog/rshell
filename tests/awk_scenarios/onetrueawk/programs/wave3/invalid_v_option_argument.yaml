description: invalid -v operands are diagnosed before the program runs
upstream:
  suite: onetrueawk
  id: testdir/T.flags
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "-v requires a var=value operand"
  - "option parsing errors produce a non-zero exit status"
input:
  awk_args:
    - -v
    - bad
  program: |
    BEGIN { print "unused" }
expect:
  stderr_contains:
    - "not in `var=value' form"
  exit_code: 1
