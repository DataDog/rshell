description: delete removes both individual array elements and whole arrays
upstream:
  suite: onetrueawk
  id: testdir/T.delete
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "delete array[index] removes one split result"
  - "delete array clears all remaining elements"
  - "membership tests after deletion report absent elements"
input:
  program: |
    {
      n = split($0, cells, ",")
      delete cells[2]
      kept = 0
      for (k in cells) kept++
      delete cells
      left = 0
      for (k in cells) left++
      print n, kept, left, (2 in cells)
    }
  stdin: |
    a,b,c
    solo
expect:
  stdout: |
    3 2 0 0
    1 1 0 0
  exit_code: 0
