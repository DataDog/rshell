description: a negated numeric regexp finds nonnumeric second fields
upstream:
  suite: onetrueawk
  id: testdir/p.17
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "a negated numeric regexp finds nonnumeric second fields"
  - "uses original rshell fixture data rather than upstream country records"
input:
  program: |
    $2 !~ /^[0-9]+$/ { print $1, $2 }
  stdin: |
    Aster	40	12	inner
    Boreal	80	66	outer
    Crux	55	101	outer
    Dune	abc	9	Dune
    Mica	12	5	inner
    Nova	70	70	Nova
expect:
  stdout: |
    Dune abc
  exit_code: 0
