description: substrings from each record are concatenated into END output
upstream:
  suite: onetrueawk
  id: testdir/p.33
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "string concatenation appends to an accumulator"
  - "substr extracts fixed-width prefixes from fields"
  - "END prints accumulated string state"
input:
  program: |
    { s = s " " substr($1, 1, 3) }
    END { print s }
  stdin: |
    magenta 10
    blue 20
    red 30
expect:
  stdout: |2
     mag blu red
  exit_code: 0
