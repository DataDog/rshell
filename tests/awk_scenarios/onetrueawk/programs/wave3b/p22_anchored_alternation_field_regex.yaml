description: anchored alternation tests a single field exactly
upstream:
  suite: onetrueawk
  id: testdir/p.22
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "field regex matching supports anchored alternation"
  - "default action prints records whose field matches exactly"
input:
  program: |
    $4 ~ /^(Asia|Europe)$/
  stdin: |
    Arden	10	3	Asia
    Beryl	20	7	Europe
    Cairn	30	11	South Asia
    Dover	40	13	Africa
expect:
  stdout: |
    Arden	10	3	Asia
    Beryl	20	7	Europe
  exit_code: 0
