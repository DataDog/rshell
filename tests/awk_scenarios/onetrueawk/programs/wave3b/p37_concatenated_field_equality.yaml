description: empty-string concatenation forces string comparison of fields
upstream:
  suite: onetrueawk
  id: testdir/p.37
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "concatenating fields with empty strings yields string operands"
  - "default action prints records whose concatenated fields compare equal"
input:
  program: |
    $1 "" == $2 ""
  stdin: |
    7 7 yes
    07 7 no
    alpha alpha yes
    alpha beta no
expect:
  stdout: |
    7 7 yes
    alpha alpha yes
  exit_code: 0
