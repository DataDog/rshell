description: regular expression range patterns print inclusive spans
upstream:
  suite: onetrueawk
  id: testdir/p.23
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "range patterns begin when the first regex matches"
  - "range patterns include the record matching the ending regex"
  - "a record matching both endpoints forms a one-record range"
input:
  program: |
    /start/, /stop/
  stdin: |
    pre one
    start alpha
    mid beta
    stop omega
    after one
    start solo stop
    tail
expect:
  stdout: |
    start alpha
    mid beta
    stop omega
    start solo stop
  exit_code: 0
