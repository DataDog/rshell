description: output redirection writes classified records that can be read later
upstream:
  suite: onetrueawk
  id: testdir/p.47
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "print redirection creates and appends to named output files"
  - "numeric conditions route records to different redirections"
  - "close makes redirected files available for later input"
input:
  program: |
    $3 > 50 { print > "tempbig" }
    $3 <= 50 { print > "tempsmall" }
    END {
      close("tempbig")
      close("tempsmall")
      while ((getline line < "tempsmall") > 0) print "small", line
      while ((getline line < "tempbig") > 0) print "big", line
    }
  stdin: |
    Aster 40 12
    Boreal 80 66
    Crux 55 101
expect:
  stdout: |
    small Aster 40 12
    big Boreal 80 66
    big Crux 55 101
  exit_code: 0
