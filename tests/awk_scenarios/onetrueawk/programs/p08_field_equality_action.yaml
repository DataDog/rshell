description: string equality on a field selects named records
upstream:
  suite: onetrueawk
  id: testdir/p.8
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "string equality on a field selects named records"
  - "uses original rshell fixture data rather than upstream country records"
input:
  program: |
    $4 == "outer" { print $1 }
  stdin: |
    Aster	40	12	inner
    Boreal	80	66	outer
    Crux	55	101	outer
    Dune	abc	9	Dune
    Mica	12	5	inner
    Nova	70	70	Nova
expect:
  stdout: |
    Boreal
    Crux
  exit_code: 0
