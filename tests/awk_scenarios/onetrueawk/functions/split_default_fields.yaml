description: split without an explicit separator uses the default field separator rules
upstream:
  suite: onetrueawk
  id: testdir/t.split2
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "split returns the number of fields found"
  - "default splitting ignores runs of whitespace"
  - "split array indexes start at one"
input:
  program: |
    {
      n = split($0, part)
      print n, part[2], part[1]
    }
  stdin: |
    red   green blue
    left	right
expect:
  stdout: |
    3 green red
    2 right left
  exit_code: 0
