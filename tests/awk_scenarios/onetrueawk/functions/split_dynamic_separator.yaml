description: split accepts a separator regular expression assembled from field data
upstream:
  suite: onetrueawk
  id: testdir/t.split3
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "split separators can be dynamic strings"
  - "character classes assembled at runtime act as regex separators"
  - "split stores empty edge fields when separators occur at string edges"
input:
  program: |
    {
      sep = "[" $1 "]"
      text = $1 $2 $1 $3 $1
      n = split(text, out, sep)
      print n, "<" out[1] ">", "<" out[2] ">", "<" out[3] ">", "<" out[4] ">"
    }
  stdin: |
    - aa bb
    : left right
expect:
  stdout: |
    4 <> <aa> <bb> <>
    4 <> <left> <right> <>
  exit_code: 0
