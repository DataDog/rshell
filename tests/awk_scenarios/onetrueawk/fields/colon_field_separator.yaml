description: FS can split colon-delimited records into numbered fields
upstream:
  suite: onetrueawk
  id: testdir/t.1
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - BEGIN can set FS before records are read
  - numbered fields reflect the configured separator
  - print uses a space OFS by default
input:
  program: |
    BEGIN { FS = ":" }
    { print $1, $2, $3 }
  stdin: |
    north:blue:7
    south:red:9
expect:
  stdout: |
    north blue 7
    south red 9
  exit_code: 0
