description: FS can be a regular expression that treats runs of tabs as one separator
upstream:
  suite: onetrueawk
  id: testdir/t.reFS
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - "BEGIN can assign a regex field separator"
  - "runs of tab separators split fields once"
  - "print still uses OFS for output separators"
input:
  program: |
    BEGIN { FS = "\t+"; OFS = "," }
    { print NF, $1, $2, $3 }
  stdin: |
    alpha	beta		gamma
    one		two	three
expect:
  stdout: |
    3,alpha,beta,gamma
    3,one,two,three
  exit_code: 0
