description: OFS controls separators inserted by print
upstream:
  suite: onetrueawk
  id: testdir/t.2
  ref: 3c2e168a8f794ed61c93131b05fb998d79d155df
covers:
  - BEGIN can set OFS before output
  - print inserts OFS between comma-separated expressions
  - field values are printed without changing the input record
input:
  program: |
    BEGIN { OFS = "===" }
    { print $1, $2, $3 }
  stdin: |
    a b c
    d e f
expect:
  stdout: |
    a===b===c
    d===e===f
  exit_code: 0
