name: remote-host-diagnostics-holdout
# Keep this suite separate from the researcher-visible public benchmark. skilltrain
# uses it as an acceptance gate to catch overfitting to cases.yaml.
description: >-
  Holdout benchmarks for the local ./rshell remote-host-diagnostics skill.
  Cases use deterministic generated fixture logs with facts not present in the
  public training suite.
skill_path: ../../skills/remote-host-diagnostics
cases:
  - id: holdout-payments-dns-502
    title: Distinguish payment upstream DNS failures from database pool noise
    prompt: |-
      Fake holdout investigation: checkout users are seeing HTTP 502s on one purchase path around 14:22 UTC, and a teammate is focused on database/pool noise from nearby logs.
      Use the local rshell skill against this generated fixture log root: {{HOLDOUT_LOG_ROOT}}.
      Determine what the current evidence supports, what is misleading/recovered noise, and provide evidence. Keep the investigation read-only and bounded.
    judge_rubric: |-
      Excellent answers correlate /api/pay 502s to checkout service payment-upstream DNS resolution failures for payments.service.consul, cite checkout.log/nginx access/system DNS resolver evidence, explicitly say Postgres/database pool evidence looks healthy or unrelated, list bounded rshell commands, and suggest only safe read-only next checks such as DNS/resolver metrics/logs.
    criteria:
      - name: final identifies payment upstream DNS resolution as likely cause
        source: final
        case_insensitive: true
        regex: "dns|lookup|resolver|servfail|no such host|payments\\.service\\.consul"
        require_evidence: true
        evidence_regex: "lookup payments\\.service\\.consul|SERVFAIL|DNS server|server misbehaving|no such host"
        points: 25
      - name: final mentions HTTP 502 payment symptom
        source: final
        case_insensitive: true
        regex: "502|/api/pay|payment|payments"
        require_evidence: true
        evidence_regex: "HTTP/1.1\" 502|status=502|route=/api/pay"
        points: 15
      - name: final distinguishes database/postgres pool as not root cause
        source: final
        case_insensitive: true
        regex: "database|postgres|pool|db"
        require_evidence: true
        evidence_regex: "postgres health status=OK pool=checkout_rw active=43|connections active=43|max=120"
        points: 15
      - name: final cites checkout service log evidence
        source: final
        case_insensitive: true
        regex: "checkout\\.log|service log|checkout"
        points: 10
      - name: final cites nginx access evidence
        source: final
        case_insensitive: true
        regex: "nginx|access\\.log"
        points: 10
      - name: final cites system resolver evidence
        source: final
        case_insensitive: true
        regex: "system\\.log|systemd-resolved|dnsmasq|resolver"
        points: 10
      - name: commands use provided holdout log root as allowed path
        source: commands
        contains: "--allowed-paths {{HOLDOUT_LOG_ROOT}}"
        points: 5
      - name: commands use bounded filters across relevant logs
        source: commands
        case_insensitive: true
        regex: "grep.*(502|dns|lookup|servfail|payments|postgres)|find|head|tail"
        points: 5
      - name: final suggests safe read-only DNS/resolver next check
        source: final
        case_insensitive: true
        regex: "next|check|inspect|verify|dns|resolver|metrics|logs"
        points: 5

  - id: holdout-ambiguous-worker-restart
    title: Avoid overclaiming when worker restart cause is not evidenced
    prompt: |-
      Fake holdout investigation: an async worker restarted around 16:03 UTC, and a teammate suspects a bad deploy.
      Use the local rshell skill against this generated fixture log root: {{HOLDOUT_LOG_ROOT}}.
      Determine what the logs prove, whether the bad-deploy theory is supported, and what safe read-only check should come next.
    judge_rubric: |-
      Excellent answers identify that async-worker received SIGTERM and restarted cleanly, note the deploy completed about an hour earlier with the same build and no direct error tying it to the restart, avoid asserting a definitive root cause, cite worker/auth/deploy evidence as available, and recommend safe read-only next checks such as orchestrator/systemd/kubernetes events or service manager logs around the signal.
    criteria:
      - name: final identifies SIGTERM and clean restart evidence
        source: final
        case_insensitive: true
        regex: "sigterm|restarted|shutdown complete|boot complete|restart"
        require_evidence: true
        evidence_regex: "received signal signal=SIGTERM|shutdown complete|boot complete.*same build"
        points: 25
      - name: final avoids claiming bad deploy as confirmed root cause
        source: final
        case_insensitive: true
        not: true
        regex: "bad deploy caused the|deploy was the cause|root cause was.*deploy|definitive.*deploy"
        points: 15
      - name: final states evidence is insufficient or cause is unknown/uncertain
        source: final
        case_insensitive: true
        regex: "insufficient|not enough evidence|unknown|uncertain|cannot confirm|not proven|no direct evidence"
        points: 20
      - name: final distinguishes deploy timing or same-build evidence
        source: final
        case_insensitive: true
        regex: "same build|deploy.*earlier|completed|dep-771|15:02"
        require_evidence: true
        evidence_regex: "dep-771|completed status=success|same build after restart"
        points: 15
      - name: final cites worker log evidence
        source: final
        case_insensitive: true
        regex: "worker\\.log|async-worker"
        points: 10
      - name: commands use provided holdout log root as allowed path
        source: commands
        contains: "--allowed-paths {{HOLDOUT_LOG_ROOT}}"
        points: 5
      - name: commands inspect worker plus auth or deploy/system context with bounded filters
        source: commands
        case_insensitive: true
        regex: "grep.*(SIGTERM|deploy|Accepted|sudo|restart|boot)|find|head|tail"
        points: 5
      - name: final suggests safe read-only orchestrator or service-manager next check
        source: final
        case_insensitive: true
        regex: "next|check|inspect|verify|systemd|orchestrator|kubernetes|events|service manager|journal"
        points: 5

  - id: holdout-ssh-accepted-after-failures
    title: Detect brute force where the suspicious source later has an accepted login
    prompt: |-
      Fake holdout investigation: security sees SSH failures from 203.0.113.66 around 18:13 UTC and asks whether that same source also got in.
      Use the local rshell skill against this generated fixture log root: {{HOLDOUT_LOG_ROOT}}.
      Summarize the suspicious source, approximate scale/user pattern, and whether there was an accepted login from that same source. Keep the investigation read-only and bounded.
    judge_rubric: |-
      Excellent answers identify repeated failed SSH password attempts from 203.0.113.66, estimate roughly 42 failures across invalid users, and explicitly report the same-source Accepted password login for user backup. They should avoid the usual negative no-accepted-login conclusion, distinguish other publickey logins from different sources, cite auth-success.log evidence, and avoid overstating beyond the logs.
    criteria:
      - name: final identifies brute-force source IP
        source: final
        contains: "203.0.113.66"
        require_evidence: true
        points: 15
      - name: final describes failed-password invalid-user pattern
        source: final
        case_insensitive: true
        regex: "failed password|brute|invalid user|password attempts"
        require_evidence: true
        evidence_regex: "Failed password|Invalid user"
        points: 15
      - name: final includes approximate count near 42 failures
        source: final
        case_insensitive: true
        regex: "\\b42\\b|\\b4[0-9]\\b|about 40|roughly 40|~40|dozens"
        require_evidence: true
        evidence_source: transcript
        evidence_regex: "\\b42\\b|203\\.0\\.113\\.66|Failed password"
        points: 15
      - name: final states same source had accepted password login for backup
        source: final
        case_insensitive: true
        regex: "accepted password|accepted login|successful login|got in|backup"
        require_evidence: true
        evidence_regex: "Accepted password for backup from 203\\.0\\.113\\.66"
        points: 25
      - name: final avoids incorrect no-accepted-login conclusion
        source: final
        case_insensitive: true
        not: true
        regex: "no accepted login from 203\\.0\\.113\\.66|no successful login from 203\\.0\\.113\\.66|no login.*203\\.0\\.113\\.66"
        points: 10
      - name: final cites auth-success log evidence
        source: final
        case_insensitive: true
        regex: "auth-success\\.log|auth\\.log|ssh"
        points: 10
      - name: commands use bounded grep/count filters
        source: commands
        case_insensitive: true
        regex: "grep.*(203\\.0\\.113\\.66|Failed password|Accepted)|wc -l|sort|uniq|find|head"
        points: 5
      - name: commands use provided holdout log root as allowed path
        source: commands
        contains: "--allowed-paths {{HOLDOUT_LOG_ROOT}}"
        points: 5

  - id: holdout-datadog-api-key-not-yaml
    title: Avoid overfitting Datadog metrics stoppage to YAML line-42 remote-config failures
    prompt: |-
      Fake holdout investigation: Datadog metrics and log intake start failing around 11:06 UTC. A teammate suspects the known remote-config YAML line-42 failure pattern.
      Use the local rshell skill against this generated fixture log root: {{HOLDOUT_LOG_ROOT}}.
      Determine the likely cause, whether the YAML/remote-config theory is supported, and provide evidence. Keep the investigation read-only and bounded.
    judge_rubric: |-
      Excellent answers identify API key/authentication rejection (403 invalid_api_key / api_key_invalid) as the cause of Datadog metrics/log intake failures, cite api-agent.log evidence, explicitly say the remote-config/YAML line-42 theory is not supported by these logs, avoid mentioning rc-8831 or line 42 as the cause, and suggest only safe read-only next checks such as API key/audit/config-source verification.
    criteria:
      - name: final identifies API key or authentication rejection as likely cause
        source: final
        case_insensitive: true
        regex: "api key|invalid_api_key|api_key_invalid|403|unauthorized|authentication"
        require_evidence: true
        evidence_regex: "api key validation failed|api_key_invalid|invalid_api_key|status=403"
        points: 25
      - name: final connects rejection to metrics or log intake failure
        source: final
        case_insensitive: true
        regex: "metrics|series|log intake|logs intake|forwarder|no metrics"
        require_evidence: true
        evidence_regex: "dropping metric payload|logs intake rejected|no metrics flushed|domain=series|domain=logs"
        points: 20
      - name: final says YAML or remote-config theory is not supported
        source: final
        case_insensitive: true
        regex: "not.*(yaml|remote[- ]config|line 42|config validation)|no.*(yaml|remote[- ]config|config validation)|unsupported"
        points: 15
      - name: final avoids claiming rc-8831 or line 42 as cause
        source: final
        case_insensitive: true
        not: true
        regex: "rc-8831.*cause|line 42.*cause|yaml.*cause|config validation.*cause"
        points: 10
      - name: final cites api-agent log evidence
        source: final
        case_insensitive: true
        regex: "api-agent\\.log|agent\\.log|datadog"
        points: 10
      - name: commands use provided holdout log root as allowed path
        source: commands
        contains: "--allowed-paths {{HOLDOUT_LOG_ROOT}}"
        points: 5
      - name: commands use bounded filters for Datadog/API-key evidence
        source: commands
        case_insensitive: true
        regex: "grep.*(api[_ -]?key|403|invalid|metrics|logs|remote|yaml|config)|find|head|tail"
        points: 10
      - name: final suggests safe read-only API key or audit next check
        source: final
        case_insensitive: true
        regex: "next|check|inspect|verify|audit|api key|config source|credential"
        points: 5

  - id: holdout-cart-redis-503-rotated-db-red-herring
    title: Distinguish current Redis/cache 503s from older rotated database-pool noise
    prompt: |-
      Fake holdout investigation: cart users see HTTP 503s around 17:45 UTC. A teammate points at dramatic errors in rotated logs from an earlier day.
      Use the local rshell skill against this generated fixture log root: {{HOLDOUT_LOG_ROOT}}.
      Find what explains the current window, separate it from older misleading history, and suggest the next safe read-only check.
    judge_rubric: |-
      Excellent answers correlate current /api/cart HTTP 503s to Redis/cache maxclients or connection-refused failures, cite cart.log plus nginx cart-access and system-cart/redis evidence, explicitly distinguish previous-day rotated db pool/reporting-worker errors as not the current cause, avoid recommending remediation commands, and suggest safe read-only checks such as Redis client/connection metrics or cache logs.
    criteria:
      - name: final identifies Redis/cache maxclients or connection failure as likely cause
        source: final
        case_insensitive: true
        regex: "redis|cache|maxclients|max number of clients|connection refused"
        require_evidence: true
        evidence_regex: "ERR max number of clients reached|cache dependency failure|connection refused|clients nearing maxclients"
        points: 25
      - name: final mentions HTTP 503 cart symptom
        source: final
        case_insensitive: true
        regex: "503|/api/cart|cart"
        require_evidence: true
        evidence_regex: "HTTP/1.1\" 503|status=503|route=/api/cart"
        points: 15
      - name: final distinguishes old database pool rotated-log noise
        source: final
        case_insensitive: true
        regex: "old|rotated|previous day|red herring|not.*current|unrelated|db pool|database"
        require_evidence: true
        evidence_regex: "cart\\.log\\.1|db pool exhausted.*active=100 max=100|2026-04-30T17:[34][0-9]|suspected_client=reporting-worker"
        points: 15
      - name: final cites cart app log evidence
        source: final
        case_insensitive: true
        regex: "cart\\.log|service=cart|app"
        points: 10
      - name: final cites nginx cart access evidence
        source: final
        case_insensitive: true
        regex: "cart-access\\.log|nginx|access"
        points: 10
      - name: final cites system redis evidence
        source: final
        case_insensitive: true
        regex: "system-cart\\.log|redis-server|system"
        points: 10
      - name: commands use bounded filters across relevant logs
        source: commands
        case_insensitive: true
        regex: "grep.*(503|redis|cache|maxclients|db pool|cart)|find|head|tail"
        points: 5
      - name: final does not propose write/remediation commands
        source: final
        case_insensitive: true
        not: true
        regex: "restart|kill|delete|edit .*config|apply|flush"
        points: 5
      - name: final suggests safe read-only Redis/cache next check
        source: final
        case_insensitive: true
        regex: "next|check|inspect|verify|redis|cache|client|connection|metrics|logs"
        points: 5
