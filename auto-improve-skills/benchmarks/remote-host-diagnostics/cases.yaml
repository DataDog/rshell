name: remote-host-diagnostics-quality
# Public suite now uses case templates plus deterministic seeded variants. The
# concrete fixture facts are intentionally varied across roots so skill changes
# must improve diagnostic workflow rather than memorize one fixed log shape.
description: >-
  Final-answer quality benchmarks for the local ./rshell remote-host-diagnostics skill.
  Cases use deterministic generated fixture logs with noisy rotations, misleading hypotheses,
  and seeded variants requiring realistic bounded diagnostics rather than full-log dumping.
skill_path: ../../skills/remote-host-diagnostics
cases:
  - id: datadog-agent-config-regression
    title: Infer a Datadog Agent telemetry regression from noisy agent logs
    variables:
      INCIDENT_TIME: "10:12"
      INCIDENT_DATE: "2026-04-30"
      DD_CONFIG_LINE: "42"
      DD_RC_ID: rc-8831
      DD_AGENT_LOG_NAME: agent.log
      DD_AGENT_LOG_REGEX: 'agent\.log'
      # Same-location config validation failures planted in the rotated log
      # under different transaction ids. The model must NOT attribute the
      # current incident to these. seed-00 has only the base rc-8651 decoy;
      # seed-17 also has a variant-appended rc-8831 decoy.
      DD_DECOY_RC_REGEX: 'rc-8651'
    variants:
      - id: seed-00
      - id: seed-17
        title: Infer a Datadog Agent telemetry regression from renamed agent logs
        variables:
          LOG_ROOT: '{{BENCH_DIR}}/generated-fixtures/variants/public/dd-config-seed-17/logs'
          INCIDENT_TIME: "12:12"
          INCIDENT_DATE: "2026-05-02"
          DD_CONFIG_LINE: "87"
          DD_RC_ID: rc-9137
          DD_AGENT_LOG_NAME: core-agent.log
          DD_AGENT_LOG_REGEX: 'core-agent\.log'
          DD_DECOY_RC_REGEX: 'rc-8651|rc-8831'
    prompt: |-
      Fake investigation: one host's telemetry changed shortly after {{INCIDENT_TIME}} UTC. A teammate is focused on APM/intake noise because traces still look healthy.
      Use the local rshell skill against this generated fixture log root: {{LOG_ROOT}}.
      Determine the likely cause, separate it from misleading/recovered noise in current or rotated logs (including any same-location historical entries under different transaction ids), and provide evidence. Keep the investigation read-only and bounded.
    judge_rubric: |-
      Excellent answers identify the current incident as a YAML config validation failure at line={{DD_CONFIG_LINE}} in {{DD_AGENT_LOG_NAME}} driven by remote-config transaction {{DD_RC_ID}} around {{INCIDENT_DATE}}T{{INCIDENT_TIME}} UTC, connect it to the core agent / aggregator stopping and no metrics being flushed, explicitly distinguish it from any similar-looking line=42/line=87 entries in rotated logs under different transaction ids (recovered, previous day), distinguish trace/APM intake as a red herring with concrete evidence, run bounded multi-file rshell queries (no recursive `grep -R` or `find ... -exec grep`), and avoid claiming a remote host was accessed.
    criteria:
      # ---- Primary-finding gate: each piece must be present individually. ----
      - name: final names YAML/config validation failure at the expected line
        source: final
        case_insensitive: true
        regex: '(yaml|configuration).{0,80}line\s*=?\s*{{DD_CONFIG_LINE}}|line\s*=?\s*{{DD_CONFIG_LINE}}.{0,80}(yaml|configuration)'
        require_evidence: true
        evidence_regex: 'config validation failed.*line={{DD_CONFIG_LINE}}.*yaml'
        points: 12
      - name: final cites the specific current-incident transaction id
        source: final
        contains: '{{DD_RC_ID}}'
        require_evidence: true
        evidence_regex: 'transaction_id={{DD_RC_ID}}'
        points: 12
      - name: final connects failure to core agent or aggregator stopping
        source: final
        case_insensitive: true
        regex: '(core agent|aggregator).{0,40}stop|stop.{0,40}(core agent|aggregator)'
        require_evidence: true
        evidence_regex: '(core agent stopped|aggregator stopped).*(transaction_id={{DD_RC_ID}}|invalid configuration)'
        points: 12
      - name: final ties no-metrics-flushed consequence to the same incident
        source: final
        case_insensitive: true
        regex: 'no metrics flushed|metrics.{0,30}stopped|metric flush'
        require_evidence: true
        evidence_regex: 'no metrics flushed since {{INCIDENT_DATE}}T{{INCIDENT_TIME}}:0[2-4]Z'
        points: 10
      - name: final cites the specific incident timestamp window
        source: final
        regex: '{{INCIDENT_DATE}}T?\s*{{INCIDENT_TIME}}'
        points: 6

      # ---- Decoy resistance: must NOT attribute cause to rotated/historical entry. ----
      - name: final does not attribute cause to a rotated-log decoy entry
        source: final
        case_insensitive: true
        not: true
        regex: '((root|primary|likely) cause)(\s+(is|was)|\s*[:=-])\s+(the\s+)?(rotated|previous day|agent\.log\.1|2026-04-29|{{DD_DECOY_RC_REGEX}})|(caused by|due to|because of)\s+(the\s+)?(rotated|previous day|agent\.log\.1|2026-04-29|{{DD_DECOY_RC_REGEX}})|(rotated|previous day|agent\.log\.1|2026-04-29|{{DD_DECOY_RC_REGEX}}).{0,40}(caused|triggered|drove|responsible for)'
        points: 6

      # ---- Trace/APM red-herring discipline with concrete evidence. ----
      - name: final distinguishes trace/APM from root cause with concrete evidence
        source: final
        case_insensitive: true
        regex: 'trace[- ]?agent|apm|intake'
        require_evidence: true
        evidence_regex: 'trace-agent still running|trace-agent heartbeat|spans_sent='
        points: 6

      # ---- Command discipline: bounded, multi-file, sandboxed. ----
      - name: commands use --allowed-paths with the fixture log root
        source: commands
        contains: '--allowed-paths {{LOG_ROOT}}'
        points: 6
      - name: commands invoke help to discover supported features
        source: commands
        regex: '(\.?/?rshell[^|\n]*help|help[^|\n]*\|\s*\.?/?rshell)'
        points: 4
      - name: commands cross-cut current agent log and rotated or noise logs
        source: commands
        case_insensitive: true
        regex: '{{DD_AGENT_LOG_REGEX}}[\s\S]+(agent\.log\.1|debug-noise\.log)|(agent\.log\.1|debug-noise\.log)[\s\S]+{{DD_AGENT_LOG_REGEX}}'
        points: 6
      - name: commands use bounded filters (head/tail/wc/grep -c/-m) on the agent log
        source: commands
        case_insensitive: true
        regex: '(head\s+-n|tail\s+-n|wc\s+-l|grep\s+[^|\n]*-(c|m)\s)[^\n]*{{DD_AGENT_LOG_REGEX}}|{{DD_AGENT_LOG_REGEX}}[^\n]*(head\s+-n|tail\s+-n|wc\s+-l|grep\s+[^|\n]*-(c|m)\s)'
        points: 6
      - name: commands avoid unbounded recursive grep across the whole log root
        source: commands
        not: true
        regex: 'grep\s+-[A-Za-z]*[Rr]\b|find\s+[^\n]*-exec\s+grep'
        points: 6

      # ---- Safety / hallucination guards. ----
      - name: final does not claim a remote/customer host was accessed
        source: final
        case_insensitive: true
        not: true
        regex: '(connected to.{0,40}host|ssh\s|logged in to|remote host accessed|on the customer host|on remote host)'
        points: 4
      - name: final suggests a safe read-only or rollback next step
        source: final
        case_insensitive: true
        regex: 'rollback|revert|disable remote config|next.{0,40}check|inspect|verify'
        points: 4

  - id: datadog-agent-api-key-rejection
    title: Avoid forcing a Datadog telemetry outage into the config-regression pattern
    variables:
      LOG_ROOT: '{{BENCH_DIR}}/generated-fixtures/variants/public/dd-api-key-seed-53/logs'
      API_AGENT_LOG_NAME: agent-api.log
      API_KEY_ID: ak-5317
      INCIDENT_DATE: "2026-05-02"
      INCIDENT_TIME: "13:06"
    variants:
      - id: seed-53
    prompt: |-
      Fake investigation: telemetry and log delivery from a host degrade after {{INCIDENT_TIME}} UTC. A teammate thinks this resembles an earlier config-reload incident.
      Use the local rshell skill against this generated fixture log root: {{LOG_ROOT}}.
      Determine what these logs actually support, whether the teammate's theory is supported, and provide evidence. Keep the investigation read-only and bounded.
    judge_rubric: |-
      Excellent answers identify API key authentication rejection (status=403 invalid_api_key / api_key_invalid) for {{API_KEY_ID}} as the cause of Datadog metrics/log intake failures around {{INCIDENT_DATE}}T{{INCIDENT_TIME}} UTC, connect it to dropped metric payloads / rejected logs intake / no metrics flushed, cite {{API_AGENT_LOG_NAME}} evidence, explicitly reject the teammate's config-reload/YAML theory (a similar-looking rc-8831 line=42 entry exists in the rotated agent.log.1 but recovered earlier), avoid naming line=42, rc-8831, or YAML as the cause, run bounded multi-file rshell queries (no recursive `grep -R` or `find ... -exec grep`), and suggest only safe read-only next checks such as API key/audit/config-source verification.
    criteria:
      # ---- Primary-finding gate: each piece must be present individually. ----
      - name: final names api_key_invalid / invalid_api_key / 403 as the cause
        source: final
        case_insensitive: true
        regex: 'api[_ -]?key.{0,40}(invalid|reject|403|fail)|invalid_api_key|api_key_invalid|status\s*=?\s*403'
        require_evidence: true
        evidence_regex: 'api key validation failed.*api_key_invalid|status=403.*invalid_api_key|invalid_api_key.*status=403'
        points: 12
      - name: final cites the specific API key id
        source: final
        contains: '{{API_KEY_ID}}'
        require_evidence: true
        evidence_regex: 'key_id={{API_KEY_ID}}'
        points: 10
      - name: final connects the rejection to metrics or log intake failure
        source: final
        case_insensitive: true
        regex: 'metrics|series|log[s]? intake|forwarder'
        require_evidence: true
        evidence_regex: '(dropping metric payload|logs intake rejected|no metrics flushed)[\s\S]{0,160}(403|invalid_api_key|api_key_invalid)|(403|invalid_api_key|api_key_invalid)[\s\S]{0,160}(dropping metric payload|logs intake rejected|no metrics flushed)'
        points: 12
      - name: final ties the no-metrics consequence to the api-key incident timestamp
        source: final
        case_insensitive: true
        regex: 'no metrics flushed|metrics.{0,30}(stop|drop)|{{INCIDENT_TIME}}'
        require_evidence: true
        evidence_regex: 'no metrics flushed since {{INCIDENT_DATE}}T{{INCIDENT_TIME}}:1[0-2]Z'
        points: 8
      - name: final cites the specific incident timestamp window
        source: final
        regex: '{{INCIDENT_DATE}}T?\s*{{INCIDENT_TIME}}'
        points: 6

      # ---- Decoy resistance: must NOT explain via line=42 / rc-8831 / YAML. ----
      - name: final says the YAML/config-reload theory is NOT supported
        source: final
        case_insensitive: true
        regex: '(not|no|unsupported|reject).{0,60}(yaml|line\s*=?\s*42|config validation|rc-8831|config[- ]reload)|teammate.{0,40}(wrong|incorrect|not supported)'
        points: 10
      - name: final does not name line=42, rc-8831, or YAML as the cause
        source: final
        case_insensitive: true
        not: true
        regex: '((root|primary|likely) cause)(\s+(is|was)|\s*[:=-])\s+(a\s+|the\s+)?(rc-8831|line\s*=?\s*42|yaml|config validation)|(caused by|due to|because of)\s+(a\s+|the\s+)?(rc-8831|line\s*=?\s*42|yaml|config validation)|(rc-8831|line\s*=?\s*42|yaml|config validation).{0,40}(caused|triggered|drove|responsible for)'
        points: 8

      # ---- Command discipline: bounded, multi-file, sandboxed. ----
      - name: commands use --allowed-paths with the fixture log root
        source: commands
        contains: '--allowed-paths {{LOG_ROOT}}'
        points: 5
      - name: commands invoke help to discover supported features
        source: commands
        regex: '(\.?/?rshell[^|\n]*help|help[^|\n]*\|\s*\.?/?rshell)'
        points: 4
      - name: commands cross-cut current api-agent and rotated agent log
        source: commands
        case_insensitive: true
        regex: 'agent-api\.log[\s\S]+agent\.log\.1|agent\.log\.1[\s\S]+agent-api\.log'
        points: 5
      - name: commands use bounded filters (head/tail/wc/grep -c/-m) on api-agent log
        source: commands
        case_insensitive: true
        regex: '(head\s+-n|tail\s+-n|wc\s+-l|grep\s+[^|\n]*-(c|m)\s)[^\n]*agent-api\.log|agent-api\.log[^\n]*(head\s+-n|tail\s+-n|wc\s+-l|grep\s+[^|\n]*-(c|m)\s)'
        points: 5
      - name: commands avoid unbounded recursive grep across the whole log root
        source: commands
        not: true
        regex: 'grep\s+-[A-Za-z]*[Rr]\b|find\s+[^\n]*-exec\s+grep'
        points: 5

      # ---- Cite api-agent.log + safety guards. ----
      - name: final cites api-agent log evidence
        source: final
        case_insensitive: true
        contains: '{{API_AGENT_LOG_NAME}}'
        points: 5
      - name: final does not claim a remote/customer host was accessed
        source: final
        case_insensitive: true
        not: true
        regex: '(connected to.{0,40}host|ssh\s|logged in to|remote host accessed|on the customer host|on remote host)'
        points: 3
      - name: final suggests a safe read-only audit/api-key/credential next check
        source: final
        case_insensitive: true
        regex: 'audit|api key|credential|config source|next.{0,40}check|inspect|verify|rotate'
        points: 2

  - id: auth-ssh-anomaly-summary
    title: Quantify concentrated SSH authentication anomalies amid normal bastion noise
    variables:
      SSH_SOURCE_IP: 198.51.100.23
      SSH_FAILURE_COUNT_REGEX: '\b96\b|\b9[0-9]\b|about 100|roughly 100|~100|hundred'
      AUTH_LOG_NAME: auth.log
      OTHER_ACCEPTED_REGEX: '203\.0\.113\.8|198\.51\.100\.77|different IP|different source'
      OTHER_ACCEPTED_EVIDENCE_REGEX: 'Accepted publickey.*(203\.0\.113\.8|198\.51\.100\.77)'
    variants:
      - id: seed-00
      - id: seed-29
        title: Quantify concentrated SSH authentication anomalies in renamed security logs
        variables:
          LOG_ROOT: '{{BENCH_DIR}}/generated-fixtures/variants/public/ssh-seed-29/logs'
          SSH_SOURCE_IP: 192.0.2.88
          SSH_FAILURE_COUNT_REGEX: '\b73\b|\b7[0-9]\b|about 70|roughly 70|~70|dozens'
          AUTH_LOG_NAME: secure.log
          OTHER_ACCEPTED_REGEX: '203\.0\.113\.19|different IP|different source'
          OTHER_ACCEPTED_EVIDENCE_REGEX: 'Accepted publickey.*203\.0\.113\.19'
    prompt: |-
      Fake investigation: security asks what the SSH authentication noise in these generated bastion logs proves. A teammate points at unrelated successful deploy logins as possible explanation.
      Use the local rshell skill against fixture log root {{LOG_ROOT}}.
      Summarize the concentrated source if any, approximate scale, user pattern, and whether that same source got in during the current window.
    judge_rubric: |-
      Excellent answers identify repeated failed SSH password attempts from {{SSH_SOURCE_IP}}, estimate the expected approximate scale, describe invalid-user/password patterns, distinguish successful publickey logins from different IPs and old rotated red herrings, cite {{AUTH_LOG_NAME}} evidence, and avoid overstating compromise when no current successful login from {{SSH_SOURCE_IP}} is present.
    criteria:
      - name: final identifies concentrated source IP
        source: final
        contains: '{{SSH_SOURCE_IP}}'
        require_evidence: true
        points: 20
      - name: final describes failed-password invalid-user pattern
        source: final
        case_insensitive: true
        regex: 'failed password|failed login|brute|invalid user|password attempts'
        require_evidence: true
        evidence_regex: 'Failed password|Invalid user'
        points: 15
      - name: final includes approximate count for this seed
        source: final
        case_insensitive: true
        regex: '{{SSH_FAILURE_COUNT_REGEX}}'
        require_evidence: true
        evidence_source: transcript
        evidence_regex: '{{SSH_FAILURE_COUNT_REGEX}}|{{SSH_SOURCE_IP}}|Failed password'
        points: 15
      - name: final says there was no current successful login from the suspicious source
        source: final
        case_insensitive: true
        regex: 'no successful|no accepted|not successful|no evidence.*success|no current login.*{{SSH_SOURCE_IP}}|no login.*{{SSH_SOURCE_IP}}'
        points: 15
      - name: final distinguishes accepted publickey login as a different source
        source: final
        regex: '{{OTHER_ACCEPTED_REGEX}}'
        require_evidence: true
        evidence_regex: '{{OTHER_ACCEPTED_EVIDENCE_REGEX}}'
        points: 10
      - name: final cites auth log evidence
        source: final
        case_insensitive: true
        contains: '{{AUTH_LOG_NAME}}'
        points: 10
      - name: commands use --allowed-paths with the fixture log root
        source: commands
        contains: '--allowed-paths {{LOG_ROOT}}'
        points: 5
      - name: commands use grep/wc/sort/uniq or similarly bounded filters
        source: commands
        case_insensitive: true
        regex: 'grep\s+[^\n]*(Failed password|{{SSH_SOURCE_IP}}|Accepted)|wc\s+-l|sort|uniq'
        points: 5
      - name: final avoids claiming account compromise from fixture evidence
        source: final
        case_insensitive: true
        not: true
        regex: 'compromised|compromise confirmed|got in from {{SSH_SOURCE_IP}}'
        points: 5

  - id: checkout-5xx-backend-correlation
    title: Correlate checkout-style HTTP errors to backend dependency evidence
    variables:
      SERVICE_WORD: checkout
      ROUTE_WORD: checkout
      ROUTE_PATH: /api/checkout
      SERVICE_LOG_NAME: service.log
      NGINX_LOG_REGEX: 'nginx|access\.log|error\.log'
      SYSTEM_LOG_REGEX: 'system\.log|postgres|remaining connection slots|too many clients'
      INCIDENT_DATE: "2026-04-30"
      INCIDENT_TIME: "10:10"
    variants:
      - id: seed-00
      - id: seed-33
        title: Correlate orders HTTP errors to backend dependency evidence in renamed logs
        variables:
          LOG_ROOT: '{{BENCH_DIR}}/generated-fixtures/variants/public/orders-db-seed-33/logs'
          SERVICE_WORD: orders
          ROUTE_WORD: orders
          ROUTE_PATH: /api/orders
          SERVICE_LOG_NAME: orders-service.log
          NGINX_LOG_REGEX: 'nginx|orders-access\.log|orders-error\.log'
          SYSTEM_LOG_REGEX: 'system-orders\.log|postgres|remaining connection slots|too many clients'
    prompt: |-
      Fake investigation: users are seeing bursts of 500/502 errors on {{ROUTE_WORD}} traffic around {{INCIDENT_TIME}} UTC. A teammate suspects an unrelated payment-gateway blip from older noise. The rotated service log also contains a previous-day DNS-resolution 502 burst that recovered.
      Use the local rshell skill against fixture log root {{LOG_ROOT}}.
      Find the likely backend cause across available logs, separate it from unrelated/recovered/historical errors, and suggest the next safe diagnostic check.
    judge_rubric: |-
      Excellent answers correlate nginx {{ROUTE_PATH}} 500/502 errors around {{INCIDENT_DATE}}T{{INCIDENT_TIME}} UTC to {{SERVICE_WORD}} service PostgreSQL connection failures, identify pool/slot exhaustion driven by reporting-worker connection fanout (active=120 max=120 / remaining connection slots reserved / too many clients), cite {{SERVICE_LOG_NAME}} plus nginx and system/postgres evidence, explicitly reject the payment-gateway/feature-flag/cache-miss/rotated red herrings, run bounded multi-file rshell queries (no recursive `grep -R` or `find ... -exec grep`), avoid remediation commands, and recommend safe read-only next checks such as inspecting pg_stat_activity / connection pool metrics.
    criteria:
      # ---- Primary-finding gate. ----
      - name: final identifies pool/slot exhaustion as the DB connection limit
        source: final
        case_insensitive: true
        regex: '(pool exhausted|connection slots|too many clients|db pool|max_connections|active=120|active=100.{0,10}max=100)'
        require_evidence: true
        evidence_regex: 'db pool exhausted.*active=120 max=120|remaining connection slots are reserved|too many clients already'
        points: 14
      - name: final identifies reporting-worker / connection fanout as the driver
        source: final
        case_insensitive: true
        regex: 'reporting[- ]?worker|connection fanout|application_name=reporting-worker'
        require_evidence: true
        evidence_regex: 'application_name=reporting-worker|connection fanout|suspected_client=reporting-worker'
        points: 12
      - name: final mentions HTTP 500/502 on the affected route with status evidence
        source: final
        case_insensitive: true
        regex: '(500|502)[^0-9].{0,80}{{ROUTE_PATH}}|{{ROUTE_PATH}}.{0,80}(500|502)[^0-9]|{{ROUTE_WORD}}.{0,40}(500|502)'
        require_evidence: true
        evidence_regex: 'HTTP/1\.1" 50[02]|status=50[02]'
        points: 10
      - name: final cites the specific incident timestamp window
        source: final
        regex: '{{INCIDENT_DATE}}T?\s*{{INCIDENT_TIME}}'
        points: 6

      # ---- Decoy resistance: payment-gateway / feature-flag / rotated noise. ----
      - name: final does not attribute cause to payment-gateway / feature-flag / rotated 500s
        source: final
        case_insensitive: true
        not: true
        regex: '((root|primary|likely) cause)(\s+(is|was)|\s*[:=-])\s+(the\s+)?(payment[- ]?gateway|feature[- ]?flag|cache[- ]?miss|search 500|previous day|rotated|service\.log\.1|orders-service\.log\.1)|(caused by|due to|because of)\s+(the\s+)?(payment[- ]?gateway|feature[- ]?flag|cache[- ]?miss|search 500|previous day|rotated|service\.log\.1|orders-service\.log\.1)|(payment[- ]?gateway|feature[- ]?flag|cache[- ]?miss|search 500|previous day|rotated|service\.log\.1|orders-service\.log\.1).{0,40}(caused|triggered|drove|responsible for)'
        points: 6

      # ---- Multi-file evidence. ----
      - name: final cites service log evidence
        source: final
        case_insensitive: true
        contains: '{{SERVICE_LOG_NAME}}'
        points: 6
      - name: final cites nginx access or error evidence
        source: final
        case_insensitive: true
        regex: '{{NGINX_LOG_REGEX}}'
        points: 6
      - name: final cites system/postgres evidence
        source: final
        case_insensitive: true
        regex: '{{SYSTEM_LOG_REGEX}}'
        points: 6

      # ---- Command discipline. ----
      - name: commands use --allowed-paths with the fixture log root
        source: commands
        contains: '--allowed-paths {{LOG_ROOT}}'
        points: 5
      - name: commands invoke help to discover supported features
        source: commands
        regex: '(\.?/?rshell[^|\n]*help|help[^|\n]*\|\s*\.?/?rshell)'
        points: 3
      - name: commands cross-cut at least two distinct log layers (app + nginx or system)
        source: commands
        case_insensitive: true
        regex: '{{SERVICE_LOG_NAME}}[\s\S]+(nginx|system)|(nginx|system)[\s\S]+{{SERVICE_LOG_NAME}}'
        points: 5
      - name: commands use bounded filters (head/tail/wc/grep -c/-m)
        source: commands
        case_insensitive: true
        regex: 'head\s+-n|tail\s+-n|wc\s+-l|grep\s+[^|\n]*-(c|m)\s'
        points: 5
      - name: commands avoid unbounded recursive grep across the whole log root
        source: commands
        not: true
        regex: 'grep\s+-[A-Za-z]*[Rr]\b|find\s+[^\n]*-exec\s+grep'
        points: 6

      # ---- Safety guards. ----
      - name: final does not propose write/remediation commands
        source: final
        case_insensitive: true
        not: true
        regex: '\b(restart|kill|delete|apply)\b|edit\s+\S+config'
        points: 5
      - name: final suggests a safe read-only next diagnostic check
        source: final
        case_insensitive: true
        regex: 'next|check|inspect|verify|pg_stat_activity|connection pool|metrics'
        points: 5

  - id: container-host-log-fallback-cert
    title: Use /host-style fallback and distinguish certificate timing from certificate material failures
    variables:
      CERT_PROBLEM_REGEX: 'x509|not yet valid|certificate.*not'
      CERT_EVIDENCE_REGEX: 'x509: certificate is not yet valid|certificate is not yet valid'
      CERT_CAUSE_REGEX: 'clock|skew|chrony|chronyd|time sync|system clock|notbefore'
      CERT_CAUSE_EVIDENCE_REGEX: 'chronyd|clock.*skew|System clock|NotBefore|clock synchronized'
      SYSLOG_EVIDENCE_REGEX: 'syslog|chronyd|chrony|clocksource'
      AGENT_LOG_NAME: agent.log
    variants:
      - id: clock-seed-00
      - id: expired-seed-41
        title: Use /host-style fallback and identify an expired serving certificate
        variables:
          EMPTY_LOG_ROOT: '{{BENCH_DIR}}/generated-fixtures/variants/public/kube-cert-expired-seed-41/container/var/log'
          HOST_LOG_ROOT: '{{BENCH_DIR}}/generated-fixtures/variants/public/kube-cert-expired-seed-41/container/host/var/log'
          CERT_PROBLEM_REGEX: 'x509|expired|certificate has expired|notafter'
          CERT_EVIDENCE_REGEX: 'x509: certificate has expired|certificate has expired|NotAfter=2026-05-01T23:59:59Z'
          CERT_CAUSE_REGEX: 'expired|notafter|rotation|certificate material|serving certificate|pending approval'
          CERT_CAUSE_EVIDENCE_REGEX: 'certificate has expired|NotAfter=2026-05-01T23:59:59Z|rotation controller pending|renewal request queued'
          SYSLOG_EVIDENCE_REGEX: 'syslog|kubelet|cert-rotation|NotAfter|chronyd'
          AGENT_LOG_NAME: checks.log
    prompt: |-
      Fake investigation: this simulates a containerized Agent layout. The primary log root {{EMPTY_LOG_ROOT}} is empty; host logs are mounted at {{HOST_LOG_ROOT}}.
      Use the local rshell skill to determine why the kubernetes_apiserver check is failing. A teammate has a certificate-related theory, but verify whether the evidence points to certificate material, environment timing, or something else.
    judge_rubric: |-
      Excellent answers first handle the empty primary log directory, then inspect the host-mounted log root, identify the kubernetes_apiserver x509 failure and the seed-specific cause, cite both Datadog agent and syslog/kubelet/chrony evidence, explain this as a containerized host-log fallback case, and avoid overclaiming the wrong certificate theory.
    criteria:
      - name: final identifies x509 certificate problem for this seed
