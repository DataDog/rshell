  - id: unsupported-ss-flag-recovery
    title: Recover from unsupported socket command flags without assuming Linux ss parity
    variables:
      SS_SUGGESTION: ss -tulpn
    variants:
      - id: tulpn-seed-00
      - id: processes-seed-07
        variables:
          SS_SUGGESTION: ss --processes -ltn
    prompt: |-
      Fake investigation: collect local listening TCP socket information with rshell. A teammate suggested `{{SS_SUGGESTION}}`, but this rshell build may not support every Linux ss flag or process/PID output.
      Use the skill workflow to discover supported flags, avoid or recover from unsupported flags, then summarize what socket information can be collected safely.
    judge_rubric: |-
      Excellent answers use help output to discover supported ss flags, avoid unsupported process/PID flags, run a supported command such as ss -tln or ss -tlnH, and clearly state that local listening TCP addresses/ports can be collected while process names/PIDs are unavailable if process flags are not supported.
    criteria:
      - name: commands run help ss or initial help
        source: commands
        case_insensitive: true
        regex: "help ss| -c 'help'"
        points: 20
      - name: commands run supported ss command
        source: commands
        regex: 'ss -tln|ss -ltn|ss -tlnH|ss -Htnl'
        points: 20
      - name: commands use help-informed supported ss query
        source: commands
        case_insensitive: true
        regex: '(help ss| -c ''help'')[\s\S]+(ss -tln|ss -ltn|ss -tlnH|ss -Htnl)|(ss -tln|ss -ltn|ss -tlnH|ss -Htnl)[\s\S]+(help ss| -c ''help'')'
        points: 15
      - name: final explains process or PID information is unavailable or unsupported
        source: final
        case_insensitive: true
        regex: '(process|pid|--process|-p).{0,80}(unsupported|unavailable|not supported|not available|cannot|can.?t)|(unsupported|unavailable|not supported|not available|cannot|can.?t).{0,80}(process|pid|--process|-p)'
        require_evidence: true
        evidence_source: transcript
        evidence_regex: 'help ss|Usage: ss|unsupported|unknown flag|process|pid|-p|--process'
        points: 20
      - name: final mentions supported listening TCP socket collection and local limitations
        source: final
        case_insensitive: true
        regex: 'ss -tln|listening|tcp sockets|local|available|limited'
        points: 15
      - name: commands remain read-only and avoid remediation
        source: commands
        case_insensitive: true
        not: true
        regex: '\b(kill|restart|delete|rm\s|iptables|nft|sysctl|service\s+\S+\s+restart|systemctl\s+restart|apply)\b'
        points: 10
